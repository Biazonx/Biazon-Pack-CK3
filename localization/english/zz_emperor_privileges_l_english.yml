 pay_all_governors_treasury_debt_available_trigger: "At least one official under your rule has [treasury_debt|E]"

 pay_all_governors_treasury_debt_effect_tt: "The [treasury_debt|E] of all indebted officials will be cleared. You will receive the corresponding hooks and [influence|E] according to the same rules as using the \"Pay Treasury Debt\" interaction on each official individually."

 pay_all_governors_treasury_debt_decision_confirm: "Authorize Repayment"