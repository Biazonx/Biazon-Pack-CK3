# Forming the Kingdom of Romania, by MyotisMyotis
ktv_events.0301.t: "The Kingdom of Romania"
ktv_events.0301.desc: "For far too long we have had to endure the domination of foreign powers over our lands. Now I have finally succeeded in uniting all the Vlachs under my rule."
ktv_events.0301.a: "Deșteaptă-te, Române!"
ktv_events.0302.desc.others: "[scoped_ruler.GetTitledFirstName] has united Moldavia and Wallachia to form the Kingdom of Romania."
ktv_events.0302.a: "A kingdom? In the middle of Wallachia?"
ktv_events.0303.t: "Empire of the Romanians"
ktv_events.0303.desc: "While many have aspired to claim the glory of Rome, only we are its true descendants. This proclamation of imperial ambition and authority will let the world know: We are Rome reborn!"
ktv_events.0303.a: "Long may we last!"
ktv_events.0304.t: "$ktv_events.0303.t$"
ktv_events.0304.desc: "The Vlachs of Carpathia, in a display of power and ambition, have declared their imperial ambition, claiming to be direct descendants of the Romans!"
ktv_events.0304.a: "What now?"
# Forming the Principality of Transylvania, by MyotisMyotis
ktv_events.0311.t: "The Principality of Transylvania"
ktv_events.0311.desc: "The Kingdom of Hungary keeps us small and I have not felt obliged to [former_liege.GetTitledFirstNamePossessive] for a long time. It's time for Transylvania to stand on its own two feet."
ktv_events.0311.a: "God bless Transylvania!"
ktv_events.0311.b: "And we have grown to adapt to this landscape."
ktv_events.0311.c: "And we have learned from, and shall eclipse, the Magyars."
ktv_events.0312.desc.liege: "I have been worried for some time about the growing influence of [scoped_ruler.GetTitledFirstName] in Transylvania and now my fears have come true.\n\nThis dirty dog now calls itself [scoped_ruler.GetTitleTierName] of Transylvania and no longer recognises my overlordship: [scoped_ruler.GetTitleTierName] has broken [former_liege.GetTitledFirstName] oath of vassalage!"
ktv_events.0312.desc.others: "After [scoped_ruler.GetFirstName] had ruled the Transylvanian lands for many years, [scoped_ruler.GetSheHe] decided to appoint [scoped_ruler.GetHerHim]self Prince of Transylvania and declare independence from [former_liege.GetTitledFirstName].\n\nFor this betrayal [scoped_ruler.GetSheHe] will pay ..."
ktv_events.0312.a: "That vicious traitor!"
ktv_events.0312.b: "This is treason against the King!"

elevate_karelia_decision: "Elevate the Karelians"
elevate_karelia_decision_desc: "With the traditional lands of the Karelians firmly under my rule, I can declare myself King over the Karelians."
elevate_karelia_decision_tooltip: "You will found a kingdom of Karelia."
elevate_karelia_decision_confirm: "To a new era!"
ktv_events.0401.t: "Foundation of a Karelian Kingdom"
ktv_events.0401.desc: "Amidst the harsh, snowy forests of the north, my deeds and fame have allowed me to proclaim a kingdom for my own people, a bulwark against the uncivilised tribes amongst our midst."
ktv_events.0401.a: "Karelians shall sing my name for eons!"
ktv_events.0401.b: "We are a most respectable player in the region."
ktv_events.0402.desc: "Our missives returned from the cold north, bringing news that one [founder.GetName] has proclaimed a Karelian kingdom."
ktv_events.0402.a: "Interesting."

form_finnic_empire_decision: "Form a Finnic Empire"
form_finnic_empire_desc: "Pressured by the Swedes of the west and the Rus' polities to the south, the disparate Finnic tribes and counts have been ruled by outsiders, remaining fragmented. There needs to be a unifying ruler to assert Finnic power against its adversaries."
form_finnic_empire_tooltip: "Create an empire out of Finnic kingdoms."
form_finnic_empire_decision_confirm: "Together we are strong."
kalevala_req_control_region: "Control at least #V 80%#! of [GetGeographicalRegion('custom_kalevala').GetName]"

ktv_events.0411.t: "Kalevala Realised"
ktv_events.0411.desc: "Rallying together the disunited Finnic peoples of the north, I have forged the an empire to protect our peoples from the Swedes, the Rus' and any other threat that may come."
ktv_events.0411.a: "Together we are strong."
ktv_events.0412.desc: "The Finnic peoples of the north have banded together under [founder.GetFullName], who had proclaimed the formation of a Finnic empire."
ktv_events.0412.a: "Fascinating"

 restore_saxony_decision: "Restore the Kingdom of Saxony"
 restore_saxony_decision_desc: "Despite the subjugation under the hands of the Franks and the forced conversion to Christianity, the memory of the Old Kingdom still lies within our heart. Perhaps it is now time to reclaim the land of our forebears."
 restore_saxony_decision_tooltip: "Saxony becomes a [de_jure|E] [kingdom|E]."
 restore_saxony_decision_effects_de_jure_tt: "If completely controlled, the [duchies|E] of [saxony_hesse.GetNameNoTier], [saxony_thuringia.GetNameNoTier], [saxony_slesvig.GetNameNoTier], [saxony_velentia.GetNameNoTier], [saxony_ostmark.GetNameNoTier], [saxony_meissen.GetNameNoTier] and [saxony_lausitz.GetNameNoTier] will each become [de_jure|E] part of Saxony."
 restore_saxony_decision_confirm: "Free once more!"
 restore_saxony_religion_req: "Must be of a pagan faith."

 # Refound Saxony
 ktv_events.0111.t: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Kingdom Restored"
 ktv_events.0111.desc: "[founder.GetPrimaryTitle.GetNameNoTierNoTooltip] was once a proud and strong Kingdom that stood defiant against the Franks but that changed with the rise of Charlemagne for he conquered our people, destroyed our culture and devastated our way of life. Despite being a prisoner of foreign tyranny, a few have remembered the Old Kingdom and they have carried in their hearts the dream of reclaiming it. With great cunning and skill, I have finally fulfilled that dream and reclaimed the lands of Old Saxony from our conquerors and refounding the kingdom of [founder.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nThe conquest of our forebears has been avenged, the tyranny of foreign kings outlasted, and now we stand ready to face whatever fresh challenges [founder.GetFaith.DevilName] may throw at us. Come what may, [founder.GetPrimaryTitle.GetNameNoTierNoTooltip] shall endure, and shall grow to be greater and more glorious than ever before."
 ktv_events.0111.a.culture: "The cultural legacy of Saxony shall flourish again!"
 ktv_events.0111.a: "I shall be the bulwark that ensures Saxony never falls again!"
 ktv_events.0111.b: "I need not a fancy name for my deeds to be remembered."
 ktv_events.0112.desc: "In a surprise of events few could ever have predicted, [founder.GetFullName] has revived the old kingdom of [founder.GetPrimaryTitle.GetNameNoTier], its memory and legacy thought forgotten to the annals of history and all but destroyed following the conquests of Charlemagne, but nevertheless the Kingdom stands again defiant before all.\n\nWhat does this mean for the legacy of Charlemagne? How long before other upstarts try to revive those that were thought dead? How long before the current order is shattered?\n\nNow many lords eye this upstart power, wishing to end it before it can even truly begin, the only thing staying their blade is the awe inspiring fervour and eagerness that [founder.GetFullName] has inspired in the [founder.GetPrimaryTitle.GetAdjective] people."
 ktv_events.0112.a: "The age of the Franks and the order they built is now at an end!"
 ktv_events.0112.b: "This upstart kingdom cannot be allowed to stand, we must bring a fury down upon them that makes the burning of the Irminsul pale in comparison!"
 ktv_events.0112.c: "Kingdoms both old and new come and go like the tide."

 # Lebanon
  elevate_lebanon_decision: "Elevate Lebanon"
  elevate_lebanon_decision_confirm: "Confirm"
  elevate_lebanon_decision_desc: "With our backs protected by Mount Lebanon, we can look outward to the Mediterranean and assert our position."
  elevate_lebanon_decision_tooltip: "Elevate Lebanon into a principality, and potentially expand the territory."
  elevate_lebanon_decision_realm_size_limit: "[realm_size|E] equal or less than #V 5#! [counties|E]"
  elevate_lebanon_decsion_baalbek: "If [baalbek.GetName] is controlled, it will be incorporated into [lebanon.GetName]"
  elevate_lebanon_decsion_acre: "If [acre.GetName] is controlled, it will be incorporated into [lebanon.GetName]"
  ktv_events.2004.t: "Atop Mount Lebanon"
  ktv_events.2004.desc: "Atop Mount Lebanon, I look out to the sea. Protected by the mountains, and with limitless potential beyond our shores, Lebanon shall enter a new era."
  ktv_events.2004.a: "The people of Lebanon will remember my name!"
  ktv_events.2004.b: "Our bastion shall stand the sands of time!"
  ktv_events.2005.desc: "[founder.GetFullName] has declared an independent principality based around Mount Lebanon. "
  ktv_events.2005.a: "Interesting."

  # Antioch
  elevate_antioch_decision: "Elevate the Principality of Antioch"
  elevate_antioch_decision_desc: "Antioch has been an important holding for Christendom after it was seized from the Sacarens. I should improve it and elevate the principality's prestige in the eyes of my brethren."
  elevate_antioch_decision_tooltip: "Elevate Antioch into a principality, and potentially expand the territory."
  elevate_antioch_decision_confirm: "A permanent foothold for Christendom!"
  elevate_antioch_decsion_edessa: "If [edessa.GetName] is controlled, it will be incorporated into [antioch.GetName]"
  elevate_antioch_decision_realm_size_limit: "[realm_size|E] equal or less than #V 8#! [counties|E]"
  ktv_events.2008.t: "The Bulwark of Antioch"
  ktv_events.2008.desc: "Antioch has been an important holding for Christendom after it was seized from the Sacarens. By asserting my control and defending it, I have ensured it remains a bulwark of Christendom in the East, and forced the continental kingdoms to acknowledge my principality as more than just an irrelevant backwater."
  ktv_events.2008.a: "Antioch shall remain Christian for as long as my dynasty lives."
  ktv_events.2009.desc: "The ruler of Antioch has declared [founder.GetHerHis] realm a principality."
  ktv_events.2009.a: "Interesting"
  # Somalia
  form_somalia_decision: "Unite the Somali Tribes"
  form_somalia_desc: "Many Somali tribes inhabit the Horn of Africa as disparate entities, often feuding and squabbling with one another. A powerful leader can rise within this environment and unite the Horn into one singular entity."
  form_somalia_tooltip: "Make Somalia a [de_jure|E] [empire|E]"
  form_somalia_decision_confirm: "This shall be the Golden Horn of Africa!"
  unite_somalia_control_req_tt: "Controls at least #V 80%#! of all [GetGeographicalRegion('custom_somalia').GetName]"
  form_sahara_decision: "Consolidate the Saharan Corridors"
  form_sahara_decision_confirm: "The sands are our home."
  form_sahara_desc: "The vast sea of sand is an environment nigh unhospitable to people, but trade has happened across it through strategic stops at oases, allowing for trade corridors to form. Wresting control of these trade corridors will allow us to proclaim a position of strength."
  form_sahara_tooltip: "Make Sahara a [de_jure|E] [empire|E]"
  unite_sahara_control_req_tt: "Controls at least #V 80%#! of all [GetGeographicalRegion('custom_sahara').GetName]"
  # Tripoli/Algiers
  form_tripolitania_decision_overlord: "Establish Viceroyalty over Tripolitania"
  form_tripolitania_decision: "Elevate Tripolitania"
  form_tripolitania_decision_confirm: "Proceed"
  form_tripolitania_decision_desc_overlord: "We have come into control of the Tripolitanian coastline. A viceroyalty should be established over the territory to assist with administration."
  form_tripolitania_decision_desc: "The Tripolitanian coastline is an area with much history, and grants access to much of Eastern Mediterranean. With it under our hands, it has the potential to be prosperous."
  form_tripolitania_decision_tooltip: "Make Tripolitania a [de_jure|E] kingdom."
  form_algiers_decision_overlord: "Establish Viceroyalty over Algiers"
  form_algiers_decision: "Elevate Algiers"
  form_algiers_decision_confirm: "Proceed"
  form_algiers_decision_desc_overlord: "We have come into control of the coastal areas near the Atlas Mountains. A viceroyalty should be established over the territory to assist with administration."
  form_algiers_decision_desc: "The coasts of the Atlas Mountains are in proximity to many important locales in the Western Mediterranean. With it under our grasp, we will be able gain much benefit from trade."
  form_algiers_decision_tooltip: "Make Algiers a [de_jure|E] kingdom."
  elevate_tripolitania_decsion_ghat: "If [completely_controlled|E] the [ghat.GetName] will become [de_jure|E] part of the [tripolitania_kingdom.GetName]"
  elevate_tripolitania_decsion_fezzan: "If [completely_controlled|E] the [fezzan.GetName] will become [de_jure|E] part of the [tripolitania_kingdom.GetName]"
  elevate_tripolitania_decsion_cyrenaica: "If [completely_controlled|E] the [cyrenaica.GetName] will become [de_jure|E] part of the [tripolitania_kingdom.GetName]"
  elevate_tripolitania_decsion_independent_inland_extras: "Forming a viceroyalty over Tripoli as an [empire|E] or [hegemony|E] is limited over coastal [GetGeographicalRegion('custom_tripolitania').GetName]."
  found_algiers_decision_tahert: "If [completely_controlled|E] the [tahert.GetName] will become [de_jure|E] part of the [algiers_kingdom.GetName]"
  found_algiers_decision_zab: "If [completely_controlled|E] the [zab.GetName] will become [de_jure|E] part of the [algiers_kingdom.GetName]"
  found_algiers_decision_mzab: "If [completely_controlled|E] the [mzab.GetName] will become [de_jure|E] part of the [algiers_kingdom.GetName]"
  elevate_algiers_decsion_independent_inland_extras: "Forming a viceroyalty over Algeria as an [empire|E] or [hegemony|E] is limited over [GetGeographicalRegion('custom_algerian_coast').GetName]."

  ktv_events.1009.t: "Empire of the Sands"
  ktv_events.1009.desc: "The Sahara, an ocean of sand, is a terrain daunting for anyone to cross. Yet by understanding the routes, cultivating our oasis cities, and controlling trade through the corridors across the desert, we have built ourselves an empire rich beyond imagination."
  ktv_events.1009.a: "The corridors of the desert are ours!"
  ktv_events.1010.desc: "[founder.GetName] has consolidated the trade corridors across the Sahara and calling it a realm of [founder.GetHerHis] own."
  ktv_events.1010.a: "This will affect trade in the region."
  ktv_events.1011.t: "Empire of the Horn"
  ktv_events.1011.desc: "The Somali tribes of the Horn, normally so disparate, has been united under my rule. As a united polity, we shall usher in a new era."
  ktv_events.1011.a: "To a new era!"
  ktv_events.1012.desc: "The Somali tribes of the Horn have come together under a powerful ruler and declared themselves an empire."
  ktv_events.1012.a: "Interesting."
  ktv_events.1013.t: "The Tripolitanian Coast"
  ktv_events.1013.desc: "The Tripolitanian coastline is an area with much history, and grants access to much of Eastern Mediterranean. With its control, I shall bring it to greatness."
  ktv_events.1013.a: "There is potential for greatness here."
  ktv_events.1013.b: "[potential_viceroy.GetShortUIName] will see to its organization."
  ktv_events.1013.b.transfer_tt: "Every [duke|E] and [count|E] vassal as well as your personal domain in [GetGeographicalRegion('custom_tripolitania').GetName] is transferred to [potential_viceroy.GetShortUIName]"
  ktv_events.1014.desc: "Centered in the historic area of Tripolitania, a realm has been formed."
  ktv_events.1014.a: "Interesting."
  ktv_events.1015.t: "The Coast of Algiers"
  ktv_events.1015.desc: "The coasts of the Atlas Mountains are in proximity to many important locales in the Western Mediterranean. With it under our grasp, the many ports of the region are just a stone's throw away."
  ktv_events.1015.a: "The riches of the Western Mediterranean are ours!"
  ktv_events.1015.b: "$ktv_events.1013.b$"
  ktv_events.1015.b.transfer_tt: "Every [duke|E] and [count|E] vassal as well as your personal domain in [GetGeographicalRegion('custom_algerian_coast').GetName] is transferred to [potential_viceroy.GetShortUIName]"
  ktv_events.1016.desc: "A polity governing part of the Western Mediterranean coast in Africa has been founded."
  ktv_events.1016.a: "Interesting."

