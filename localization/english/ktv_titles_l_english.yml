  form_pictland_decision: "Rekindle the Pictish Legacy"
  form_pictland_decision_confirm: "The Picts rise again!"
  form_pictland_decision_desc: "The Picts once spanned various tribes across the highlands of Caledonia. With cultural blending and assimilation, as well as invaders from elsewhere, the influence has diminished. But the memory of the great kingdoms of Fortriu and Circinn remained with us, and a great ruler may aspire to unite the old Pictish lands."
  form_pictland_decision_tooltip: "Pictland becomes a [de_jure|E] [kingdom|E]"
  ktv_events.0025.t: "Pictish Blue"
  ktv_events.0025.desc: "Once, Pictish rulers commanded the clans of the highlands. Now, they shall again, but under a unified banner."
  ktv_events.0025.a: "The Picts once again rule the highlands."
  ktv_events.0025.b: "We shall become the new Picts and adopt this legacy."
  ktv_events.0026.desc: "The Picts have banded together into their own kingdom in the highlands, putting behind their divided histories."
  ktv_events.0026.a: "Interesting."

  k_gaeldom: "Gaeldom"
  k_gaeldom_adj: "Gaelic"
  k_gaeldom_article: "the "
  cn_gaeldom: "Gaeldom"
  cn_gaeldom_adj: "Gaeldom"
