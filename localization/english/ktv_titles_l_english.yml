  cn_caledonia_adj: "Caledonian"
  cn_myraefi: "Mýræfi"
  form_gaeldom_decision: "Unite the Gaeldom"
  form_gaeldom_decision_confirm: "The Gaeldom stands strong!"
  form_gaeldom_decision_desc: "A fusion of Gaelic and Pictish traditions, the Gaels have inhabited the highlands of Caledonia ever since the peoples of Dal Riata and pictland merged to form the Kingdom of Alba. However, the Scots have for a time encroached into the lowlands and gradually amassing more power among themselves, sidelining the Gaels, who deserve a real king over them and not #emp Scotland#!."
  form_gaeldom_decision_tooltip: "Gaeldom becomes a [de_jure|E] [kingdom|E]"
  ktv_events.0023.t: "Land of the Gaels"
  ktv_events.0023.desc: "A fusion of Gaelic and Pictish traditions, the Gaels have inhabited the highlands of Caledonia ever since the peoples of Dal Riata and pictland merged to form the Kingdom of Alba. However, the Scots have for a time encroached into the lowlands and gradually amassing more power among themselves, sidelining the Gaels, who deserve a real king over them. From today onward, they shall have one."
  ktv_events.0023.a: "The Scots will no longer be able to hamper us."
  ktv_events.0024.desc: "The Gaels of the Caledonian highlands have declared themselves a kingdom, discontent with the encroachment of the Scots."
  ktv_events.0024.a: "Interesting."

  reform_sorbia_decision: "Restore Sorbia"
  reform_sorbia_decision_confirm: "Sorbia rises again!"
  reform_sorbia_decision_desc: "Milcenia and Lusatia, once home of the Sorbs, have been conquered and ruled by the Holy Roman Empire. However, Sorbs cry out for a kingdom of their own, free from attempts of assimilation."
  reform_sorbia_decision_tooltip: "Sorbia becomes a [de_jure|E] [kingdom|E]"
  reform_sorbia_overlord_decision: "Restore the Sorbian March"
  reform_sorbia_overlord_decision_confirm: "Restore"
  reform_sorbia_overlord_decision_desc: "Despite attempts to fold the Sorbian lands into Germany, they remain resistant to our rule. It appears a Sorbian march is once again necessary."
  reform_sorbia_overlord_decision_tooltip: "Sorbia becomes a [de_jure|E] [kingdom|E]"
  ktv_events.0139.t: "Sorbia Reborn"
  ktv_events.0139.desc: "The Holy Roman Empire has eyed us as an easy target, a meddlesome bunch of backwards tribals they could merely step on and impose their ways of life and law. This is not the case, and a kingdom among us will be an important step in proving it."
  ktv_events.0139.a: "The Empire will not vanquish us."
  ktv_events.0140.desc: "The Polabians of the Sorbian March has declared themselves no subject of the encroaching Empire, but an independent kingdom in their own right."
  ktv_events.0140.a: "Interesting"
  ktv_events.0139.t.overlord: "The Sorbian March"
  ktv_events.0139.desc.overlord: "Despite the Empire's subjugation of the Sorbs and attempts to pacify them, the difficulty necessitated in the restoration of a Sorbian march."
  ktv_events.0139.a.overlord: "Let's hope this will pacify the troublesome Polabians."

  k_iceland: "Iceland"
  k_iceland_adj: "Icelandic"
  form_iceland_decision: "Form an Icelandic Kingdom"
  form_iceland_decision_confirm: "Convene the Althing"
  form_iceland_decision_desc: "The kings of the Scandinavian mainland are far away, and though our great island have their roots there, they can no longer exert control over us."
  form_iceland_decision_tooltip: "Iceland becomes a [de_jure|E] [kingdom|E]"
  ktv_events.0413.t: "The First Althing for an Icelandic King"
  ktv_events.0413.desc: "With my rule over Iceland absolute, I have the support of my subjects, and with our distance, the kings of Denmark and Norway cannot meaningfully influence this island. Convene the Althing - the kingdom of Iceland is founded today!"
  ktv_events.0413.a: "The mainland cannot control us."
  ktv_events.0413.a.restore_norse: "The old ways of our fathers remain alive here."
  ktv_events.0414.desc: "The Norsemen of Iceland have declared a kingdom unto themselves, with the kingdoms on the mainland too far away to exert real control."
  ktv_events.0414.a: "Interesting"

  d_tsushima: "Tsushima"
  d_tsushima_adj: "Tsushima"
  ktv_events.4219.t: "An Age of Piracy"
  ktv_events.4219.desc: "Tsushima, being in an advantageous location, was a hub of trade between Japan, Korea and China - and of course, also of piracy. Instead of peaceful trading, we have opted to cooperate with the wokou and fund their endeavours. Before long, Tsushima shall become the capital of the world's wealth."
  ktv_events.4219.a: "The #emp wokou#! will usher in a new age for Tsushima."
  ktv_events.4219.b: "We are no longer beholden to the Tenno and his puppeteer."
  form_tsushima_decision: "Embrace Wokou Piracy"
  form_tsushima_decision_confirm: "A golden age of piracy dawns!"
  form_tsushima_decision_desc: "Tsushima, being in an advantageous location, was a hub of trade between Japan, Korea and China - and of course, also of piracy. The so-called wokou have wreaked havoc on ports and merchants, bringing in mass wealth. While piracy is rather dishonourable, perhaps we can take advantage of the wokou - and allow us to participate in the profits of privateering."
  form_tsushima_decision_tooltip: "Elevate Tsushima into its own [de_jure|E] [duchy|E]"
  malta_event_troops: "Maltese Pirates"
  tsushima_wokous: "Wokou Bands"
  tsushima_opinion_malus: "Every ruler with a coastal territory in [GetTitleByKey('e_japan').GetName], [GetTitleByKey('e_goryeo').GetName], [GetTitleByKey('e_andong').GetName], [GetTitleByKey('e_zhongyuan').GetName] and [GetTitleByKey('e_jingyang').GetName] will lose #N 50#! opinion of you."

