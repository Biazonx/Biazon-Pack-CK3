  form_swabia_decision: "Form Swabia"
  form_swabia_decision_confirm: "Swabia is mine!"
  form_swabia_decision_desc: "Formerly home of the Suebi and Alemanni tribes, Swabia was one of the tribal duchies of the Holy Roman Empire. By asserting influence over the region, I could lay claim to the entire principality and rule over all Swabians."
  form_swabia_decision_tooltip: "Make Swabia a [de_jure|E] [kingdom|E]"
  found_swabia_decision_swiss_territories: "Every [completely_controlled|E] [duchy|E] in [GetGeographicalRegion('custom_core_switzerland').GetName] will become [de_jure|E] part of Swabia"
  ktv_hre_stem_duchy_req: "Is independent or liege is either the Holy Roman Empire or the Roman Empire."
  ktv_events.0121.t: "Swabia Elevated"
  ktv_events.0121.desc: "Through my might and control, the domains of the Swabians have been conslidated and elevated."
  ktv_events.0121.a: "We are stronger than ever."
  ktv_events.0122.desc: "Swabian polities have united under a strong ruler in [founder.GetName], who now represents the interests of all Swabians within [founder.GetHerHis] lands."
  ktv_events.0122.a: "Interesting."

  form_franconia_decision: "Form Franconia"
  form_franconia_decision_confirm: "Franconia is mine!"
  form_franconia_decision_desc: "As the rest of Austrasia is split away into the Kingdom of Lotharingia, the remaining territory grew to become the stem duchy of Franconia. By uniting the constellation of small polities across Franconia, I can elevate the region into a force to be reckoned with."
  form_franconia_decision_tooltip: "Make Franconia a [de_jure|E] [kingdom|E]"
  ktv_events.0123.t: "Franconia Elevated"
  ktv_events.0123.desc: "As the rest of Austrasia is split away into the Kingdom of Lotharingia, the remaining territory grew to become the stem duchy of Franconia. As the uniter of these otherwise fragmented polities, I will turn Franconia into a force to be reckoned with."
  ktv_events.0123.a: "$ktv_events.0121.a$"
  ktv_events.0124.desc: "[founder.GetName] has united the disparate Franconian polities and claim the stem duchy of Franconia."
  ktv_events.0124.a: "$ktv_events.0122.a$"

  form_lower_saxony_decision: "Formalize the Saxon Stem Duchy"
  form_lower_saxony_decision_confirm: "Saxony is mine!"
  form_lower_saxony_decision_desc: "Deriving from the lands of Old Saxony before Charlemagne subdued and incorporated them into the Frankish Empire, the stem duchy of Saxony got its roots. As an important cornerstone of Charlemagne's empire, I shall bring it to glory." #As German settlers and migrants moved eastwards beyond the Elbe, there rose a need to distinguish between Lower Saxony, the historic stem duchy, and Upper Saxony, which laid beyond the Elbe. Uniting these historic lands will allow me lay claim to the stem duchy.
  form_lower_saxony_decision_tooltip: "Make the stem duchy of Saxony [de_jure|E] [kingdom|E]"
  ktv_events.0125.t: "Saxony Elevated"
  ktv_events.0125.desc: "The stem duchy of Saxony, derived from the lands of Old Saxony before Charlemagne subdued and incorporated them into the Frankish Empire. Under my rule, this territory has been consolidated once more."
  ktv_events.0125.a: "$ktv_events.0123.a$"
  ktv_events.0126.desc: "The lands of old Saxony has been united by the powerful [founder.GetName]."
  ktv_events.0126.a: "$ktv_events.0124.a$"

  form_upper_saxony_decision: "Form the Electorate of Saxony"
  form_upper_saxony_decision_confirm: "To a new Saxony!"
  form_upper_saxony_decision_desc: "The hinterlands to the East have for too long remained outside of the reach of the Empire. We must consolidate these titles into a new Saxony, to secure our rule over the region."
  form_upper_saxony_decision_tooltip: "Make Saxony a [de_jure|E] [kingdom|E] beyond the Elbe"
  form_upper_saxony_kingdom_decision_effect_meissen_stretch_goals_tt: "If [completely_controlled|E], [meissen.GetName] becomes [de_jure|E] part of [upper_saxony.GetName]"
  form_upper_saxony_kingdom_decision_effect_lausitz_stretch_goals_tt: "If [completely_controlled|E], [lausitz.GetName] becomes [de_jure|E] part of [upper_saxony.GetName]"
  form_upper_saxony_kingdom_decision_effect_nordmark_stretch_goals_tt: "If [completely_controlled|E], [nordmark.GetName] becomes [de_jure|E] part of [upper_saxony.GetName]"
  form_upper_saxony_kingdom_decision_effect_ostmark_stretch_goals_tt: "If [completely_controlled|E], [ostmark.GetName] becomes [de_jure|E] part of [upper_saxony.GetName]"
  ktv_events.0127.t: "The Electorate of Saxony"
  ktv_events.0127.desc: "Long has Polabia been out of the hands of the enemies of the [founder.GetPrimaryTitle.GetTierAsNameNoTooltip], but now its populace have come to regard $e_hre$ as their true home.\n\nWith the establishment of the Electorate of Saxony, the region of Upper Saxony will remain now and forever in the hands of the [founder.GetTitleAsNameNoTooltip] and under the guidance of [founder.GetFaith.HighGodName]."
  ktv_events.0127.a: "$ktv_events.0125.a$"
  ktv_events.0128.desc: "[founder.GetName] has established the Electorate of Saxony in the old lands of the Polabians, formalising it as part of the Holy Roman Empire."
  ktv_events.0128.a: "$ktv_events.0126.a$"
  ktv_events.0141.t: "The Two Saxonies"
  ktv_events.0141.desc: "With multiple polities claiming the name of Saxony within the expanse of the Empire, the names Upper and Lower Saxony has developed due to a need of distinction, based on their location - Lower Saxony according to lands of the old stem duchy, and Upper Saxony for the lands of the electorate in the lands or Sorbia."
  ktv_events.0141.a: "So be it."

  form_prussia_decision_balts: "Unite the Prussian Tribes"
  form_prussia_decision: "Form Kingdom in Prussia"
  form_prussia_decision_balts_desc: "We face constant raids from the Norse, pressure from the Poles and the Germans of the Holy Roman Empire eye our lands with hunger. We must band together or die."
  form_prussia_decision_desc: "Prussia, where the pagan Balts live, is ripe for Christianisation. We must seek to secure this land and exert control over these heathens - and the Baltic - before others can get to it."
  form_prussia_decision_tooltip: "Prussia becomes a [de_jure|E] [kingdom|E]"
  form_prussia_decision_confirm: "Prussia is mine!"
  culture_derived_from_saxon: "You are of a culture descended from [GetCultureByKey('saxon').GetName]"
  culture_derived_from_franconian: "You are of a culture descended from [GetCultureByKey('franconian').GetName]"
  form_prussia_kingdom_decision_effect_pomerelia_incomplete_stretch_goals_tt: "As only [danzig.GetName] and [berent.GetName] are controlled, the western half of [pomerelia.GetName] will become [de_jure|E] part of [pommerania.GetName], while the remaining half becomes [de_jure|E] part of [prussia.GetName]."
  form_prussia_kingdom_decision_effect_pomerelia_stretch_goals_tt: "If [completely_controlled|E], [pomerelia.GetName] becomes [de_jure|E] part of [prussia.GetName]. If only [danzig.GetName] and [berent.GetName] are controlled, the western half of [pomerelia.GetName] will become [de_jure|E] part of [pommerania.GetName], while the remaining half becomes [de_jure|E] part of [prussia.GetName]."
  form_prussia_kingdom_decision_effect_memel_stretch_goals_tt: "If [scalovia.GetName] and [memel.GetName] are controlled, they will become [de_jure|E] part of [prussia.GetName] under a new duchy."
  ktv_feudal_margrave_male_german_group: "$feudal_margrave_male_german_group$"
  ktv_feudal_margrave_female_german_group: "$feudal_margrave_female_german_group$"
  ktv_feudal_margrave_title_german_group: "$feudal_margrave_title_german_group$"

  form_brandenburg_decision: "Proclaim the Margraviate of Brandenburg"
  form_brandenburg_decision_confirm: "I shall be the bulwark of the Empire!"
  form_brandenburg_decision_desc: "With the Empire's relentless efforts to push east beyond the Elbe, land has opened up for land auctions and grants in the region, inviting German settlers to make these formerly Slavic lands home. Having come into the possession of Brandenburg and its environs, I shall declare the formation of a great border state."
  form_brandenburg_decision_tooltip: "Brandenburg becomes a [de_jure|E] [kingdom|E]"
  form_brandenburg_kingdom_decision_effect_pomerelia_stretch_goals_tt: "If [slupsk.GetName] and [miastko.GetName] are [completely_controlled|E], the counties become part of [pommerania.GetName]."
  form_brandenburg_kingdom_decision_effect_pomerania_stretch_goals_tt: "If [completely_controlled|E], [pommerania.GetName] becomes [de_jure|E] part of [brandenburg.GetNameNoTier]. Additionally, if [slupsk.GetNameNoTier] and [miastko.GetNameNoTier] are [completely_controlled|E], the counties become part of [pommerania.GetNameNoTier]."

  form_hanover_decision: "Form Hanover"
  form_hanover_decision_confirm: "They will respect me!"
  form_hanover_decision_desc: "The city of Hanover, owing to prudent investments and its advantageous location as a crossroad of trade throughout the Empire, has developed greatly, becoming a regional centre of power. It would not be out of the question to proclaim a principality centered around the city, a polity to become a dominant power in North Germany."
  form_hanover_decision_tooltip: "Hanover becomes a [de_jure|E] [kingdom|E]"
  development_level_greater_or_equal: "Development of [TITLE.GetNameNoTier] is greater or equal to $NUM|V0$"

  form_westfalen_decision: "Form Westphalia"
  form_westfalen_decision_confirm: "Grüß' dich Gott, Westfalenland!"
  form_westfalen_decision_desc: "The Lower Rhine and Westphalia, owing to their proximity, has been closely linked both in economics and in Imperial affairs. Formally unifying both will allow for a unified polity to establish itself as a mighty power, breaking the grip of the clergy on the cities."
  form_westfalen_decision_tooltip: "Westphalia becomes a [de_jure|E] [kingdom|E]"

  unite_veletia_decision: "Confederate the Veleti and Lutici"
  unite_veletia_decision_confirm: "Together we are stronger."
  unite_veletia_decision_desc: "Disunited and weak, we make for good prey for the Holy Roman Empire eyeing our lands. United, we can stand a chance to fend them off and defend our lands."
  unite_veletia_decision_tooltip: "Veletia becomes a [de_jure|E] [kingdom|E]"
  found_veletia_holstein_stretch: "If [completely_controlled|E], [holstein.GetName] becomes [de_jure|E] part of [veletia.GetNameNoTier]."

  ktv_events.0129.t: "Kingdom of Prussia"
  ktv_events.0129.desc: "We have organised a kingdom in the lands of Prussia."
  ktv_events.0129.a: "Stand tall, Prussia!"
  ktv_events.0130.desc: "[founder.GetName] has consolidated the lands of Prussia and proclaimed a kingdom."
  ktv_events.0130.a: "Interesting"
  ktv_events.0131.t: "The Margraviate of Brandenburg"
  ktv_events.0131.desc: "With the lands in the Ostmark consolidated, we have laid foundations to a grand margraviate on the edge of the Empire."
  ktv_events.0131.a: "This margraviate is merely a foundation."
  ktv_events.0132.desc: "The margraves of Brandenburg has claimed an elevation of status."
  ktv_events.0132.a: "Lofty, they are."
  ktv_events.0133.t: "A Bastion Against Encroachment"
  ktv_events.0133.desc: "We may have differences, but separated, we remain easy prey for the Holy Roman Empire. United, we can be the bulwark that stops the Empire's expansion and protect our lands."
  ktv_events.0133.a: "The Empire shall be stopped."
  ktv_events.0134.desc: "The Slavic tribes beyond the Elbe has banded together under one great ruler, intended to fend off the Holy Roman Empire."
  ktv_events.0134.a: "They may try."
  ktv_events.0135.t: "Rise of Hanover"
  ktv_events.0135.desc: "The city of Hanover, owing to prudent investments and its advantageous location as a crossroad of trade throughout the Empire, has developed greatly, becoming a regional centre of power. For that, it is only right that a principality is founded around the city - and I, its ruler."
  ktv_events.0135.a: "Nec aspera terrent."
  ktv_events.0136.desc: "A great principality has emerged, centred around the growing city of Hanover."
  ktv_events.0136.a: "Let's see."
  ktv_events.0137.t: "Westfalenland"
  ktv_events.0137.desc: "Often bound together in both politics and economics, the Lower Rhine and Westphalia has experienced closer connections. By uniting both, I can assert the region's might within the Empire."
  ktv_events.0137.a: "Grüß' dich Gott, Westfalenland!"
  ktv_events.0138.desc: "A great ruler has proclaimed a principality in Westphalia, fueled by the robust trade of the Rhine."
  ktv_events.0138.a: "Interesting."

  establish_principality_muscovy_decision: "Establish a Principality in Moskva"
  establish_principality_muscovy_decision_confirm: "We are no weaker than our neighbors."
  establish_principality_muscovy_decision_desc: "From a backwater, the settlement of Moskva has blossomed into a great city. It is time we proclaim ourselves equals to our fellow princes and dukes."
  establish_principality_muscovy_decision_tooltip: "Muscovy becomes a [de_jure|E] [duchy|E]"
  form_muscovy_duchy_decision_effect_tver_stretch_goals_tt: "If [completely_controlled|E], [tver.GetName] will become [de_jure|E] part of [muscovy.GetName]"
  establish_grand_principality_muscovy_decision: "Establish a Grand Principality in Moskva"
  establish_grand_principality_muscovy_decision_confirm: "We shall be foremost among the Rus'!"
  establish_grand_principality_muscovy_decision_desc: "With the lack of a Rus' grand principality, every prince is out for themselves looking to assert dominance over all Rus'. It is time we cast our hats in the lot."
  establish_grand_principality_muscovy_decision_tooltip:  "Muscovy becomes a [de_jure|E] [kingdom|E]"
  establish_grand_principality_muscovy_duchies_de_jure_tt: "Every completely controlled [duchy|E] within the territories of [GetGeographicalRegion('custom_muscovy_expanse').GetName] becomes [de_jure|E] part of the new Muscovite grand principality."
  form_muscovy_kingdom_decision.completely_control_X_percents_from_muscovite_aspirations: "At least #V 70%#! of [counties|E] in the territories of [GetGeographicalRegion('custom_muscovy_expanse').GetName] is controlled by you."
  HAS_COUNTY_MODIFIER_TRIGGER: "[TITLE.GetNameNoTier] has the $MODIFIER|V$ [county|E] [modifier|E]"
  NOT_HAS_COUNTY_MODIFIER_TRIGGER: "[TITLE.GetNameNoTier] does not have the $MODIFIER|V$ [county|E] [modifier|E]"
  establish_grand_principality_muscovy_decision_no_ruthenia_tt: "No [ruler|E] holds [GetTitleByKey('k_ruthenia').GetNameNoTier] or [GetTitleByKey('e_russia').GetNameNoTier]"

  ktv_events.0421.t: "Prince of Moskva"
  ktv_events.0421.desc: "With the development of Moskva among the fragmented Rus' principalities, we have finally amassed enough power and wealth to proclaim ourselves as Princes of Moskva."
  ktv_events.0421.a: "And all the other princes will bow to me eventually."
  ktv_events.0423.t: "The New Centre of Rus' Authority"
  ktv_events.0423.desc: "With the growth of Moskva and our power eclipsing the rival princes, we are now able to declare ourselves the Grand Prince of Moskva, shifting the centre of Rus' power northwards to us."
  ktv_events.0423.a: "Perhaps I should become Tsar of all Rus'..."
  ### Brunswick and Hanover
  hre_develop_braunschweig: "Develop Braunschweig"
  hre_develop_braunschweig_confirm: "Here lies the foundation of a prosperous city!"
  hre_develop_braunschweig_tooltip: "Develop the county of Braunschweig and turn it into the centre of Eastphalia."
  hre_develop_braunschweig_desc: "Braunschweig is proving itself to be a regional centre of commerce and trade. Under my stewardship, it can even be more resplendent and prosperous."
  hre_develop_berlin: "Build up Berlin"
  hre_develop_berlin_confirm: "Here stands the seat of my margraviate."
  hre_develop_berlin_tooltip: "Develop the county of Berlin."
  hre_develop_berlin_desc: "A powerful margrave deserves a powerful seat of power. Let's build up Berlin to be a formidable capital for the Empire's borders."
  ktv_berlin_brandenburg_duchy_replaces_ostmark: "The [GetTitleByKey('d_brandenburg').GetName] will absorb the [de_jure|E] territories of the [GetTitleByKey('d_ostmark').GetName]"
  hre_develop_hanover: "Develop Hanover"
  hre_develop_hanover_confirm: "May a prosperous city rise!"
  hre_develop_hanover_tooltip: "Develop the county of Hanover."
  hre_develop_hanover_desc: "At a location navigable by river, and a connection point to many important regions in western Germany, Hanover has immense economic potential. Let's invest in this city."
  ktv_unlock_form_hanover_kingdom_tt: "Allows the formation of the [GetTitleByKey('k_hanover').GetName]"
  ostfalen_brunswick_name_change: "The [GetTitleByKey('d_ostfalen').GetName] will become known after the city of Brunswick and adopt new coat of arms."
  ktv_develop_moskva: "Develop Moskva"
  ktv_develop_moskva_tooltip: "Develop the county of Moskva, allowing for the formation of a [duchy|E] centered around the city."
  ktv_develop_moskva_confirm: "This will be a great city one day."
  ktv_develop_moskva_desc: "Moskva is on a location conducive to growth, with proximity to rivers and a fairly flat terrain, in contrast to the forests around us. We should invest to ensure the growth of this locality."
  ktv_unlock_form_moskva_duchy_tt: "Allows the formation of the [GetTitleByKey('d_muscovy').GetName]"

  establish_aragonese_empire_decision: "Establish the Crown of Aragon" 
  establish_aragonese_empire_decision_confirm: "We are masters of the Mediterranean!" 
  establish_aragonese_empire_decision_desc: "From our position in eastern Hispania, looking out towards the Mediterranean, we are well-positioned to benefit from extensive trade. Our destiny belong not solely on the Iberian Peninsula, but to spread the jurisdiction of the Consolat de Mar across the entire sea."  
  establish_aragonese_empire_decision_tooltip: "Aragon becomes a [de_jure|E] [empire|E]" 
  ktv_events.0211.t: "The Crown of Aragon"
  ktv_events.0211.desc: "With many crowns across the Mediterranean Sea, the Crown of Aragon is a composite of all my titles, an expansive realm straddling the Mediterranean. With control over key cities on the coast, we are sure to benefit much from trade - and project our power outwards."
  ktv_events.0211.a: "My magnanimity will be known!"
  ktv_events.0211.b: "Ruling this expansive empire is enough."
  ktv_events.0212.desc: "The ruler of Aragon has proclaimed a unification of all [founder.GetHerHis] titles, naming an expansive empire across the Mediterranean. Such an empire is sure to hold much sway in regional commerce."
  ktv_events.0212.a: "A thalassocracy..."

