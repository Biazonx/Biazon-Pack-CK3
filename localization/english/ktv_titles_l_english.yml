  form_anatolia_decision: "Unite Anatolia"
  form_anatolia_decision_desc: "The plateaus and mountains of Anatolia have long been coveted by many empires and aspiring great rulers. It is only right that the might of the region should be consolidated under a powerful emperor, ruling directly from its highlands."
  form_anatolia_decision_tooltip: "Anatolia becomes a [de_jure|E] [empire|E]"
  form_anatolia_decision_confirm: "Unite Asia Minor"
  ktv_events.3011.t: "One Crown Over Anatolia"
  ktv_events.3011.desc: "Through conquest and firm rule, I have established myself as the one true ruler of Anatolia. The emperors and aspirants who sought to conquer these mountains will stand no chance against my might."
  ktv_events.3011.a: "I am emperor of all Anatolia!"
  ktv_events.3012.desc: "[founder.GetShortUIName], a powerful regional ruler, has united all of Anatolia under [founder.GetHerHis] banner."
