  restore_aquitainian_kingdom_decision_confirm: "There shall be a king over Aquitania!"
  restore_aquitainian_kingdom_decision_desc: "Aquitaine has often been subjected to the whims of the crowns of Francia, who sought to control and assimilate the region into their domain. This must not be allowed to happen."
  restore_aquitainian_kingdom_decision_tooltip: "Re-establish Aquitaine as a [de_jure|E] [kingdom|E]."

