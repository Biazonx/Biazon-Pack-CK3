  create_slovakia_decision: "Create Nitra Principality"
  create_slovakia_decision_desc: "Ever since the collapse of Great Moravia, the Franks and Magyars have threatened our homeland, and encroach on our territory, governing us with little regard to our interests. We must declare a realm of the Sloviens and assert our freedoms from these meddlers."
  create_slovakia_decision_tooltip: "Nitra becomes a [de_jure|E] [kingdom|E]."
  create_slovakia_decision_confirm: "Hold the sabre and endure."
  create_balaton_decision: "Create Balaton Principality"
  create_balaton_decision_desc: "The Balaton is a region of the Carpathians, where the Franks and Magyars have been encroaching upon our lands. We must declare a realm of the Balatines and assert our freedoms from these meddlers."
  create_balaton_decision_tooltip: "Balaton becomes a [de_jure|E] [kingdom|E]."
  create_balaton_decision_confirm: "Hold the sabre and endure."

  form_gascony_basque_culture_requirements_tt: "At least #V 5#! counties in [GetTitleByKey('d_gascogne').GetName] and [GetTitleByKey('d_armagnac').GetName] are [GetCultureByKey('basque').GetName]"
  form_gascony_decision: "Form Gascony"
  form_gascony_decision_desc: "Though the dreams of Old Vasconia are long dead, Basque peoples have clung on to the other side of the Pyrennes, in a corner of what is now called Aquitaine. Even then, there is nothing stopping a strong ruler from establishing a Vasconia - or Gascony, as it is now known by the denizens of this side of the mountains - of their own in these lands."
  form_gascony_decision_tooltip: "Gascony becomes a [de_jure|E] [kingdom|E]"
