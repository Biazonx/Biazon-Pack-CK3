  expand_neustrian_march_decision_desc: "Neustria is at the frontier of our great empire, but as part of the Carolingian Empire, it once denoted a much larger expanse. Let's push the boundaries of our own Neustria further."
  expand_neustrian_march_decision_tooltip: "Expand the Neustrian [de_jure|E]"

