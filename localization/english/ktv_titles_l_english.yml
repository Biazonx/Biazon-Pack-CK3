  d_morgannwg: "Morgannwg"
  d_morgannwg_adj: "Morgannwg"
  reclaim_east_powys_decision: "Reclaim Eastern Powys"
  reclaim_east_powys_decision_desc: "The eastern territories of Powys has been lost ever since the Mercian king Offa invaded those lands and built a mighty dyke to forever separate us from the Anglo-Saxons. We must cross this boundary and reclaim these lands."
  reclaim_east_powys_decision_tooltip: "Return Shropshire and Hereford under the [de_jure|E] of Powys"
  reclaim_east_powys_decision_confirm: "Cross the dyke!"
  d_pengwern: "Pengwern"
  d_pengwern_adj: "Pengwern"
  cn_shropshire: "Shropshire"
  cn_shropshire_adj: "Salopian"
  cn_cornovia: "Cornovia"
  cn_cornovia_adj: "Cornovii"
  cn_glamorgana: "Glamorgana"
  form_morgannwg_decision: "Formalize Morgannwg"
  form_morgannwg_decision_confirm: "Unite South Wales"
  form_morgannwg_decision_desc: "The petty kingdoms of Glywysling and Gwent has had a history often intertwined. With both under our control, we should formalise the governance of these polities under a unified title - Morgannwg."
  form_morgannwg_decision_tooltip: "Make Morgannwg a [de_jure|E] [duchy|E]"
  ktv_events.0007.t: "Passing the Dyke"
  ktv_events.0007.desc: "Despite the Mercian king Offa invading these lands and building a mighty dyke to prevent us from reclaiming them, we have overcome the odds and restored these territories to a Brythonic banner.  "
  ktv_events.0007.a: "Glorious."
  ktv_events.0007.b: "I shall be king of Powys #emp and#! Pengwern!"
  ktv_events.0008.t: "Ruler of Morgannwg"
  ktv_events.0008.desc: "Under my rule, the petty kingdoms of Glywysling and Gwent have now been formally united into one."
  ktv_events.0008.a: "I am a powerful Welsh ruler!"

  k_semien: "Beta Israel"
  k_semien_adj: "Beta Israelite"
  form_semien_decision: "Form Beta Israel"
  form_semien_decision_confirm: "Formalize the House of Israel"
  form_semien_decision_desc: "As followers of Judaism, we are often under the rule of our Christian counterparts. This is often not to our advantage, and we must ensure the Housse of Israel's equality to the House of Christianity."
  form_semien_decision_tooltip: "Beta Israel becomes a [de_jure|E] [kingdom|E]"
  ktv_events.1019.t: "House of Israel"
  ktv_events.1019.desc: "With fierce determination and power, we have affirmed Beta Israel as a land believers of Yahweh could call home."
  ktv_events.1019.a: "The Beta Kristiyan will not vanquish us!"
  ktv_events.1020.desc: "The Haymanot of Abyssinia have amassed enough power to declare their realm the Beta Israel, a home for all believers free of Coptic influence."
  ktv_events.1020.a: "Interesting."

  k_pictland: "Pictland"
  k_pictland_adj: "Pictish"
  d_fortriu: "Fortriu"
