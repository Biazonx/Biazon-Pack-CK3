unify_jurchen_lands_decision: "Unify the Jurchens"
unify_jurchen_lands_decision_desc: "The Jurchens have been under outside vassalage and tributary for too long. As a great leader, I shall champion the Jurchens to a new destiny, beyond Khitan overlordship and China's preying eyes."
unify_jurchen_lands_decision_desc_post_jin: "Just as the Jin have, I shall champion the Jurchens and found a proper empire."
unify_jurchen_lands_decision_tooltip: "Elevate the lands of the Jurchen into a proper empire."
