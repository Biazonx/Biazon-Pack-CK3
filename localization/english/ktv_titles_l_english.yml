restore_alexander_macedonia_decision: "Restore Macedonia"
restore_alexander_macedonia_decision_tooltip: "Restore Macedonia"
restore_alexander_macedonia_decision_confirm: "We rise!"
restore_alexander_macedonia_decision_desc: "The kingdom of Macedonia, famed in the historical records as the home of Alexander the Great, was once a formidable force. Now that I have reclaimed its core territories, I can declare the restoration of this old kingdom, and perhaps follow in Alexander's footsteps."
restore_macedonia_decision_effects_de_jure_tt: "The Kingdom of Macedonia will be restored with Thessaly and Thessalonika under de jure."
ktv_events.3001.t: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Kingdom Restored"
ktv_events.3001.desc: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] is an ancient Hellenic kingdom with a proud history. By refounding the Kingdom of [founder.GetPrimaryTitle.GetNameNoTierNoTooltip], I have restored Alexander's home, and from here, I shall strike further, as Alexander had.\n\nAnd under my reign, [founder.GetPrimaryTitle.GetNameNoTierNoTooltip] shall persist."
ktv_events.3001.a: "I am as Alexander reborn!"
ktv_events.3001.b: "My kingdom is all that matters."
ktv_events.3002.desc: "After a lifelong struggle, [founder.GetFullName] has elevated the lands of [founder.GetPrimaryTitle.GetNameNoTier] under a united banner."
ktv_events.3002.a: "Interesting."

k_albania: "Albania"
k_albania_pre: "Albano"
k_albania_adj: "Albanian"
cn_arbanon: "Arbanon"
cn_arbanum: "Arbanum"
form_albania_decision: "Found Kingdom of Albania"
form_albania_decision_desc: "If the various Albanian tribes were to be united under a suitable ruler, Albania could become a kingdom of its own."
form_albania_decision_subject: "Request Albanian Autonomy"
form_albania_decision_subject_desc: "By leveraging owed favours with my liege, I can request increased privileges and autonomy to handle Albanian subjects."
form_albania_decision_desc_italian: "By establishing an Albanian kingdom, I can placate its people while asserting my control over the entry into the Adriatic."
form_albania_decision_tooltip: "Albania becomes a [de_jure|E] [kingdom|E]"
form_albania_decision_confirm: "Found the Kingdom of Albania"
cultural_acceptance_albanian_elevated: "Albanian Kingdom Founded"
albania_formation_modifier: "Albanian Fortifications"

elevate_achaea_decision: "Elevate Achaea"
elevate_achaea_decision_desc: "The Peloponnese peninsula carried a storied history, from its place as a center of Hellenic civilization, its great city-states of Sparta, Corinth and more, and in the case of the Peloponnesian and Delian leagues, a history of uniting against adversary despite our differences. Under Roman rule, Achaea saw herself falling from grace to a provincial backwater, but now that I have asserted its place on the map, this will no longer be the case."
elevate_achaea_decision_tooltip: "Form the Kingdom of Achaea"
elevate_achaea_decision_confirm: "Aien aristeuein."
elevate_achaia_decision_effects_de_jure_tt: "The Kingdom of Achaea will be founded."
ktv_events.3003.t: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Kingdom Elevated"
ktv_events.3003.desc: "The Peloponnese peninsula carried a storied history in the Hellenic world. By elevating the Kingdom of [founder.GetPrimaryTitle.GetNameNoTierNoTooltip], I shall bring glory to these great lands."
ktv_events.3003.a: "Aien aristeuein."
ktv_events.3003.b: "My kingdom is all that matters."
ktv_events.3004.desc: "After a lifelong struggle, [founder.GetFullName] has elevated the lands of [founder.GetPrimaryTitle.GetNameNoTier] under a united banner."
ktv_events.3004.a: "Interesting."

elevate_aegean_islands_decision: "Consolidate the Aegean Islands"
elevate_aegean_islands_decision_desc: "For time immemorial, the Aegean Sea and its islands have been important in order to control and benefit from commerce and trade of the Hellenic world. I shall consolidate these disparate islands into a unified whole."
elevate_aegean_islands_decision_tooltip: "Form the Kingdom of Archipelago"
elevate_aegean_islands_decision_confirm: "Aien aristeuein."
elevate_aegean_islands_decision_effect_krete_stretch_goals_tt: "If [completely_controlled|E] the [krete.GetName] will become [de_jure|E] part of the [aegean_sea.GetName]"
ktv_events.3005.t: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Kingdom Elevated"
ktv_events.3005.desc: "The Aegean Sea and its islands have been instrumental to commerce in the Hellenic world. By consolidating the Kingdom of [founder.GetPrimaryTitle.GetNameNoTierNoTooltip], I shall bring glory to these great islands."
ktv_events.3005.a: "Aien aristeuein."
ktv_events.3005.b: "My kingdom is all that matters."
ktv_events.3006.desc: "After a lifelong struggle, [founder.GetFullName] has elevated the lands of [founder.GetPrimaryTitle.GetNameNoTier] under a united banner."
ktv_events.3006.a: "Interesting."

restore_cappadocia_decision: "Restore Cappadocia"
restore_cappadocia_decision_desc: "On the confluence of the Hellenic and Persian worlds, the Kingdom of Cappadocia lasted three centuries before being absorbed by the burgeoning Roman Empire. However, it shall be a prospering realm under my stewardship."
restore_cappadocia_decision_tooltip: "Restore Cappadocia"
restore_cappadocia_decision_confirm: "For Ariarathes!"
form_cappadocia_kingdom_decision_effect_sebasteia_stretch_goals_tt: "If [completely_controlled|E] the [sebasteia.GetName] will become [de_jure|E] part of the [cappadocia.GetName]"
ktv_events.3007.t: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Kingdom Restored"
ktv_events.3007.desc: "As a great ruler of the interior of Anatolia, I have seen it fit to restore the old kingdom of Cappadocia, at the confluence of the old Hellenic and Persian worlds. May I outlast my predecessors."
ktv_events.3007.b: "I will make Ariarathes proud!"
ktv_events.3007.a: "On second thought, let's focus on maintaining this kingdom."
ktv_events.3008.desc: "[founder.GetFullName] has declared a continuation of the old kingdom of Cappadocia."
ktv_events.3008.a: "Interesting."

restore_assyria_decision: "Restore Assyria"
restore_assyria_decision_desc: "The Assyrian Empire, though long consigned to the annals of history, remained in the imagination of many. Perhaps it is time to reclaim that glory."
restore_assyria_decision_tooltip: "Restore the ancient kingdom of Assyria"
restore_assyria_decision_confirm: "To Assur!"
assyria_capital_assur_decision: "Restore Assur"
assyria_capital_nineveh_decision: "Restore Nineveh"
assyria_capital_assur_decision_desc: "Assur, the birthplace of old Assyria, have fallen into ruin after the centuries. Restoring this great city's stature will elevate my place - and Assyria's - in the world."
assyria_capital_nineveh_decision_desc: "Nineveh, the great capital of later Assyria, have fallen into obscurity, dwarfed by other cities such as Mosul. I shall return this great city to its rightful place, as the centre of the Assyrian world"
assyria_capital_assur_decision_tooltip: "Restore Assur"
assyria_capital_nineveh_decision_tooltip: "Restore Nineveh"
assyria_capital_decision_confirm: "Restore"
ktv_events.2001.t: "Heirs of Assur"
ktv_events.2001.desc: "The Assyrian Empire, though long consigned to the annals of history, remained in the imagination of many. Now that I have reclaimed its core territories, I shall herald a revival of the empire of old.\n\nSuch a great realm requires a capital befitting of its status. Over centuries, what was Assur were but ruins and Nineveh has been dwarfed by other settlements nearby, but restoring an ancient capital would no doubt gain currency for my Assyrian restoration. Alternatively, [mosul.GetName] has developed nicely in the intervening decades, and would be less work..."
ktv_events.2001.a: "Assur, the birthplace of Assyria, will do nicely."
ktv_events.2001.b: "Only the great city of Nineveh is befitting."
assyria_restoration_restore_old_capital: "You will gain a decision to invest in the restoration of your chosen barony."
ktv_events.2001.c: "[mosul.GetName] is already a fine city."
ktv_events.2001.d: "Assyria is more than just its capital."
ktv_events.2002.desc: "[founder.GetTitledFirstName] has proclaimed [founder.GetHerHim]self the ressurection of the old Assyrians!"
ktv_events.2002.a: "That upstart!"
ktv_events.2003.assur: "Assur Restored"
ktv_events.2003.nineveh: "Nineveh Restored"
ktv_events.2003.assur_desc: "With blood and toil, we have restored the old capital of Assur to its former glory!"
ktv_events.2003.nineveh_desc: "With blood and toil, we have restored the old capital of Nineveh to its former glory!"
ktv_events.2003.a: "Glory to Assyria!"
b_assur: "Aššur"

elevate_catalonia_decision: "Elevate Catalonia"
elevate_catalonia_decision_desc: "As Catalonia breaks free of Frankish grasp, we must make sure this land can stand on its own two feet, against the turmoil of Iberia and the ambitions of France."
elevate_catalonia_decision_tooltip: "Found the Kingdom of Catalonia"
elevate_catalonia_decision_confirm: "Mes que una terra"
ktv_events.0201.t: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Kingdom Elevated"
ktv_events.0201.desc: "Through struggle, I have established Catalonia as a kingdom unto itself, equal to that of the Franks and the squabbling crowns of Iberia. May Catalonia be a bulwark for all Catalans for generations to come."
ktv_events.0201.a: "Glorious!"

found_majorca_decision: "Found Majorca"
found_majorca_decision_desc: "Consolidating the Balearic Islands, with their desirable strategic position, into a whole will no doubt further my plans."
found_majorca_decision_tooltip: "Found the Kingdom of Majorca"
found_majorca_decision_confirm: "Assert Destiny"
ktv_events.0202.t: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Kingdom Founded"
ktv_events.0202.desc: "As the ruler of all the Balearic islands, I have seen fit to unite the archipelago into a kingdom of its own."
ktv_events.0202.a: "Glorious!"

