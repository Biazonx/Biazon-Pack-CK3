restore_dal_riata_decision: "Restore the Kingdom of Dál Riata"
restore_dal_riata_decision_confirm: "We rise!"
# restore_dal_riata_decision_desc: "We have reclaimed the territory of the ancient kingdom of Dál Riata, bringing the Coast of the Gaels back into Gaelic hands."
restore_dal_riata_decision_desc: "The ancient kingdom of Dál Riata was a unification of the Gaelic peoples of the coast, its mighty fleets and seafaring culture the envy of many. We must claim this ancestral legacy and revive it."
restore_dal_riata_decision_effects_de_jure_tt: "Ancient Dál Riata is restored, becoming a De Jure kingdom with the Western Isles and Ulster as de jure duchies."
restore_dal_riata_decision_tooltip: "Restore ancient Dál Riata."
nick_mor: "Mór"
nick_mor_desc: "This character is recognised by many as a great ruler."
ktv_events.0001.t: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Kingdom Restored"
ktv_events.0001.desc: "An ancient Gaelic kingdom, once stood proud before having merged with the Picts and its islands conquered by the Norse. By refounding the Kingdom of [founder.GetPrimaryTitle.GetNameNoTierNoTooltip], I have restored these lands to Gaelic hands.\n\nCome what may, [founder.GetPrimaryTitle.GetNameNoTierNoTooltip] shall endure."
ktv_events.0001.a: "I am as Fergus Mór reborn!"
ktv_events.0001.b: "My kingdom is all that matters."
ktv_events.0002.desc: "After a lifelong struggle, [founder.GetFullName] has reunited the lands of [founder.GetPrimaryTitle.GetNameNoTier] under a Gaelic banner, repelled those who have invaded, and proclaim a kingdom."
ktv_events.0002.a: "Interesting."
ktv_events.0002.b: "Minor kingdoms come and go."
ktv_events.0002.c: "Preposterous!"
ktv_events.0003.t: "Western Isles Reclaimed"
ktv_events.0003.desc: "Outside forces pushed their claims on the Western Isles of our kingdom. After an exhausting campaign, however, [ROOT.Char.GetTitledFirstName] of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] has managed to vanquish the enemy and reclaim the Isles for our realm."
ktv_events.0003.a: "The Western Isles are a natural part of Scotland."
ktv_events.0004.t: "Ulster Reclaimed"
ktv_events.0004.desc: "Outside forces pushed their claims on Ulster. After an exhausting campaign, however, [ROOT.Char.GetTitledFirstName] of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] has managed to vanquish the enemy and reclaim the Isles for our realm."
ktv_events.0004.a: "Ulster is a natural part of Ireland."
proclaimed_dal_riata_modifier: "Proclaimed Dál Riata"
reclaim_western_isles_decision: "Reclaim the Western Isles"
reclaim_western_isles_decision_desc: "An outsider kingdom has staked their claims on the islands west of our shores. This warrants correction."
reclaim_western_isles_decision_confirm: "Reclaim"
reclaim_western_isles_decision_tooltip: "Reintegrate the Innse Gall into [de_jure|E] Scotland"
reclaim_ulster_decision: "Reclaim Ulster"
reclaim_ulster_decision_confirm: "Back to the fold"
reclaim_ulster_decision_desc: "An outsider kingdom has staked their claims on the historic region of Ulster. This warrants correction."
reclaim_ulster_decision_tooltip: "Reintegrate Ulster into [de_jure|E] Ireland"

elevate_carantania_decision: "Elevate Carantania"
elevate_carantania_decision_desc: "Since the fall of Samo's Empire and the subjugation of the Principality of Carantania, the people of this region has been constantly under the yoke of outside meddlers. No more."
elevate_carantania_decision_tooltip: "Elevate Carinthia into a kingdom"
elevate_carantania_decision_confirm: "Elevate"
form_carantania_kingdom_decision_effect_carinthia_stretch_goals_tt: "If [completely_controlled|E] the [carinthia.GetName] will become [de_jure|E] part of the [krain.GetName]"
form_carantania_kingdom_decision_effect_steyermark_stretch_goals_tt: "If [completely_controlled|E] the [steyermark.GetName] will become [de_jure|E] part of the [krain.GetName]"
form_carantania_kingdom_decision_effect_stretch_fail_istria_tt: "As it is cut off but not [completely_controlled|E], the [istria.GetName] defects [de_jure|E] to the [new_controller.GetName]"
ktv_events.0101.t: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Kingdom Proclaimed"
ktv_events.0101.desc: "Since the fall of Samo's Empire and subjugation by the Franks, the [founder.GetCulture.GetName] have not had a polity to call home. As the undisputed leader of all [founder.GetCulture.GetName], I shall declare this kingdom an eternal home for my people."
ktv_events.0101.a: "To greatness!"
ktv_events.0101.b: "May our kingdom persist."
ktv_events.0102.desc: "[founder.GetFullName], the undisputed leader of all [founder.GetCulture.GetName], has proclaimed a kingdom for the [founder.GetCulture.GetName] people."
ktv_events.0102.a: "Fascinating."

ktv_events.0103.t: "Destiny of Carantania"
ktv_events.0103.desc: "Since the demise of the old Carantanian kingdom under the hands of the Franks, much has changed in the landscape surrounding the region. As the kingdom is reforged, I must decide where Carantania must find its destiny in."
ktv_events.0103.a: "In [italy_empire.GetNameNoTier] we shall find our calling"
ktv_events.0103.b: "It is our destiny to rise to prominence within [bavaria_empire.GetNameNoTier]."
ktv_events.0103.c: "The splendor of [croatia_empire.GetNameNoTier] awaits."
ktv_events.0103.d: "We shall align our destiny to [hungary_empire.GetNameNoTier]"

claim_nabatea_legacy: "Claim Nabataean Legacy"
claim_nabatea_legacy_confirm: "Restore"
claim_nabatea_legacy_desc: "Among these lands stood the the old Nabataean Kingdom, which for a long time dominated the region politically and commercially, and in their demise left behind wide traces of their culture and architecture. By claiming their legacy, we can restore and improve upon their great works."
restore_nabatea_decision_tooltip: "Claim the legacy of the Nabataean Kingdom"
restore_nabatea_decision_effects_de_jure_tt: "The ancient Nabataean Kingdom is restored."
ktv_events.1001.t: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Kingdom Restored"
ktv_events.1001.desc: "The Nabataean Kingdom was a kingdom of antiquity with a rich culture. By refounding the Kingdom of [founder.GetPrimaryTitle.GetNameNoTierNoTooltip], we will restore and improve upon their work."
ktv_events.1001.a: "Glorious."
ktv_events.1002.desc: "[founder.GetFullName] has reunited the lands of [founder.GetPrimaryTitle.GetNameNoTier] and claimed the legacy of the ancient kingdom."
ktv_events.1002.a: "Interesting."
ktv_events.1003.t: "Petra Restored"
ktv_events.1003.desc: "The historic city of Petra, once a bustling commercial and political hub of the Nabataeans, has been restored under our rule. May it prosper forevermore."
ktv_events.1003.a: "We truly are the rightful successors of the Nabataeans."
restore_petra_decision_effects_tt: "Restore the ancient city of Petra and directly control it."
petra_capital_decision: "Restore Petra"
petra_capital_decision_desc: "The historic city of Petra, once a bustling commercial and political hub of the Nabataeans, is now in ruins. By restoring it, we can strengthen our claims to the legacy of the Nabataean Kingdom."
petra_capital_decision_tooltip: "Restore the ancient city of Petra."
petra_capital_decision_confirm: "An old city built anew!"

claim_zenobia_legacy: "Claim Zenobia's Legacy"
claim_zenobia_legacy_confirm: "Restore"
claim_zenobia_legacy_desc: "Stories of old tell of a cultured queen named Zenobia who carved out a realm of her own between the Romans and the Persians during the Crisis of the Third Century. Though short-lived, the Palmyrene Empire and its empress has inspired many historians, artists and novelists. By following the footsteps of Zenobia, we will also proclaim a realm of our own to rival the two empires."
restore_palmyra_decision_tooltip: "Claim the legacy of Palmyra"
form_palmyra_decision_effect_egypt_stretch_goals_tt: "If [completely_controlled|E] the [egypt.GetName] will become [de_jure|E] part of the [palmyra.GetName]"
form_palmyra_decision_effect_anatolia_stretch_goals_tt: "If [completely_controlled|E] the [anatolia.GetName] will become [de_jure|E] part of the [palmyra.GetName]"
form_palmyra_decision_effect_cappadocia_stretch_goals_tt: "If [completely_controlled|E] the [cappadocia.GetName] will become [de_jure|E] part of the [palmyra.GetName]"
form_palmyra_decision_effect_lebanon_stretch_goals_tt: "If [completely_controlled|E] the [lebanon.GetName] will be come [de_jure|E] part of the [palmyra.GetName]"
form_palmyra_decision_effect_kilikia_stretch_goals_tt: "If [completely_controlled|E] the [kilikia.GetName] will be come [de_jure|E] part of the [palmyra.GetName]"
form_palmyra_decision_effect_antioch_stretch_goals_tt: "If [completely_controlled|E] the [antioch.GetName] will be come [de_jure|E] part of the [palmyra.GetName]"
ktv_events.4001.t: "Palmyrene Empire Restored"
ktv_events.4001.desc: "Stories of old tell of a cultured queen named Zenobia who carved out a realm of her own between the Romans and the Persians during the Crisis of the Third Century. Though short-lived, the Palmyrene Empire and its empress has inspired many historians, artists and novelists. By following the footsteps of Zenobia, we have carved out an empire of our own, independent from Roman and Persian yokes."
ktv_events.4001.a: "Glorious."
ktv_events.4002.desc: "[founder.GetName] has declared [founder.GetHerHim]self emperor of an independent Palmyra, evoking memories of Queen Zenobia's defiance against the Roman yoke."
ktv_events.4002.a: "We'll see how long they last."

