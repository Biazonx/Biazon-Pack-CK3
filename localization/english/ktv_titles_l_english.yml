ktv_events.4201.t: "Proclamation of [jusen_gurun.GetNameNoTierNoTooltip]"
ktv_events.4201.desc: "I have united an empire of the Jurchen people, and from here I shall make a name for this people into history."
ktv_events.4201.a: "I shall be remembered as a great Khan!"
ktv_events.4201.b: "Our intrepid people shall be known by a new name!"
ktv_jurchen_become_manchu_effect_tt: "The Jurchen culture will henceforth be known as #emp Manju#!, and the new empire as #emp Manju Gurun#!. Any counties, courtiers or guests of Mohe culture will adopt Manju culture."
ktv_events.4201.c: "A new page in our history has been written."
ktv_events.4202.desc: "The Jurchen peoples have united under a charismatic leader, one [founder.GetName], who has proclaimed a [jusen_gurun.GetName]."
ktv_events.4202.manchu: "\n\nAs a means of fostering unity within the fledging empire, [founder.GetName] has decreed that the Jurchen people will now be known as Manchu."
ktv_events.4202.a: "Bah, unruly barbarians!"
ktv_events.4202.b: "Not another Jin..."

