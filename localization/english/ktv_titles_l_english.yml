  restore_ancient_egypt_decision: "Restore the Egyptian New Kingdom"
  restore_ancient_egypt_decision_confirm: "The Pharaoh's authority lives!"
  restore_ancient_egypt_decision_desc: "Egypt, a cradle of civilization, was once home for a great empire that waxed and waned over timespans that felt almost eternal. To aspire to greatness, we should aspire to replicate the ways of this great empire, and the Pharaohs of old."
  restore_ancient_egypt_decision_tooltip: "Make a [de_jure|E] Egyptian Empire in the mold of the Pharaohs of old."
  restore_ancient_egypt_punt_stretch_tt: "All [duchies|E] in the [GetGeographicalRegion('custom_kemetic_punt').GetName] will be organised into a kingdom under the Egyptian Empire."
  restore_ancient_egypt_punt_stretch_incomplete_tt: "If [completely_controlled|E], the [GetGeographicalRegion('custom_kemetic_punt').GetName] will be incorporated into the Egyptian Empire as a kingdom."
  restore_ancient_egypt_kush_stretch_tt: "The [GetGeographicalRegion('custom_kemetic_kush').GetName] will be incorporated into the Egyptian Empire as a kingdom."
  ktv_events.1021.t: "Glory of Egypt"
  ktv_events.1021.desc: "The Kingdoms of Egypt, through their periods of boom and bust, reached a zenith with the New Kingdom, their influence spreading from Syria to Punt. As one who holds the Egyptian throne, and a great conqueror who aspired for the legacy of old, I have reforged this ancient empire."
  ktv_events.1021.a: "The ancient customs of Kemet shall be revived."
  ktv_events.1021.b: "Look on my works, ye mighty, and despair!"
  ktv_events.1022.desc: "[founder.GetShortUIName], a great conqueror, has proclaimed [founder.GetHerHim]self an inheritor of the ancient Egyptian legacy, and declared an empire in their mold."
  ktv_events.1022.a: "Yet the lone and level sands stretch far away."

  e_visigoths_article: "the "
  e_visigoths: "Visigoths"
  e_visigoths_adj: "Visigothic"
  reclaim_visigothic_kingdom_decision: "Reclaim the Visigoth Legacy"
  reclaim_visigothic_kingdom_decision_confirm: "The eagle flies again."
  reclaim_visigothic_kingdom_decision_desc: "The Visigoths, under whose rule Iberia had been transformed after the fall of the Western Roman Empire, fell after the Umayyad conquest of the majority of the peninsula. Even then, their legacy can be felt through the law and culture of the lands. We should claim this legacy and style ourselves as King of the Visigoths to aspire to their greatness."
  reclaim_visigothic_kingdom_decision_tooltip: "Proclaim yourself King of the Visigoths."
  reclaim_visigothic_kingdom_decision_unlock_visigothic_empire_tt: "Allows the proclamation of a Visigothic Empire."
  proclaim_visigothic_empire_decision: "Proclaim the Visigothic Empire"
  proclaim_visigothic_empire_decision_confirm: "Raise the banner of the eagle!"
  proclaim_visigothic_empire_decision_desc: "In the past, Visigothic kings have, in different times, controlled both the Kingdom of Toulouse and the entirety of Hispania. This is an admirable legacy that we ought to replicate."
  form_visigothic_empire_must_end_struggle_trigger: "The [iberian_struggle|E] must be resolved first."
  proclaim_visigothic_empire_decision_tooltip: "Replicate and rekindle the legacy of the Visigoths and reintegrate the Kingdom of Toulouse into [GetTitleByKey('e_spain').GetName]."
  establish_visigothic_empire_aquitaine_titular_achieved_tt: "The [GetTitleByKey('k_aquitaine').GetName] will be recreated and will be integrated."
  proclaim_visigothic_empire_decision_toledo: "The [GetTitleByKey('k_toledo').GetName] will be founded in Toledo, as the heartland of Hispania and of the Empire of the Visigoths"
  visigothic_empire_iberian_cultures_gain_tech_tt: "Every culture with Iberian [heritage|E] gains a Military & Civic [innovation|E]"
  visigothic_empire_toledo_growth_tt: "Every county in [GetTitleByKey('d_toledo').GetNameNoTier] gets the [GetModifier('heart_of_hispania_modifier').GetName] modifier for #V 25#! years."
  visigoths_formation_modifier: "Rex Visigothorum"
  visigoths_formation_modifier_desc: "This is the dynasty of the proclaimed King of the Visigoths, drawing from a legacy of old."
  heart_of_hispania_modifier: "Heart of Hispania"
  heart_of_hispania_modifier_desc: "At the centre of Hispania and the centre of the Visigothic Kingdom, the lands of Toledo and its environs are experiencing prosperity."
  ktv_events.0221.t: "Rex Visigothorum"
  ktv_events.0221.desc: "Though the Visigothic Kingdom was an old memory to some and legend to others, we, who traced our heritage to this kingdom and its rulers, have proven ourselves worthy to the claim of the banner that once flew through all Hispania. From today on, our line shall be known as #emp Rex Visigothorum#!, King of the Visigoths!"
  ktv_events.0221.a: "We shall bring back the old ways of the Visigoths!"
  ktv_events.0221.b: "A claim to their legacy is enough."
  ktv_events.0222.desc: "[founder.GetName], a ruler in Hispania, has laid claim to the legacy of the Visigothic Kingdom, styling [founder.GetHerHim]self as King of the Visigoths."
  ktv_events.0222.a: "Interesting."
  ktv_events.0223.t: "Empire of the Visigoths"
  ktv_events.0223.desc: "Under the banner of the Visigothic eagle, our armies have marched and conquered the entirety of Hispania, as our ancestors once ruled; moreover, our banner has also risen over Aquitaine, the old Kingdom of Toulouse that the perfidious Franks and their flase emperors have stolen away. From the banks of the Loire to the Pillars of Hercules, the eagle soars again."
  ktv_events.0223.b: "Glorious!"
  ktv_events.0224.desc: "From the Loire to the Pillars of Hercules, the Visigothic eagle banner stood. [founder.GetShortUIName], who proclaimed [founder.GetHerHim]self King of the Visigoths has fulfilled the promises of [founder.GetHerHis] claims, and restored Visigothic rule to Hispania, and additionally reclaimed the lost territories in Francia."
  ktv_events.0224.a: "Interesting."

  e_serbia: "Serbia"
  e_serbia_adj: "Serbian"
  nick_the_mighty: "the Mighty"
  d_vardar: "Vardar"
  d_vardar_adj: "Vardarian"
  b_tsarigrad: "Carigrad"
  b_tsarigrad_adj: "Carigrad"
  custom_serbian_empire_core: "Serbian Empire"
  serbia_formation_modifier: "Emperor and Autokrator of the Serbs and Romans"
  constantinople_sacked_modifier: "Remnants of the Old Rome"
  constantinople_sacked_modifier_desc: "Utterly despoiled and looted of its wealth; it is barely recognisable as the City of the World's Desire anymore."
  third_rome_capital_modifier: "Third Rome"
  third_rome_capital_modifier_desc: "Claiming the legacy of the Roman Empire, this city is the prosperous and glorious capital of an ascendant empire."
  ktv_events_despoiled_constantinople: "Despoiled Constantinople"
  establish_serbian_empire_decision: "Establish a Serbian Empire"
  establish_serbian_empire_decision_confirm: "The age of Byzantium is over!"
  establish_serbian_empire_decision_desc: "It is clear that the so-called Roman Empire is weak and feeble, no longer capable of being the shield against outsider incursions. It is only right that we take up that mantle for ourselves."
  establish_serbian_empire_decision_tooltip: "Serbia becomes a [de_jure|E] [empire|E]"
  establish_serbian_empire_bosnia_completely_controlled_is_titular_tt: "[GetTitleByKey('k_bosnia').GetName] will be created as a constituent [de_jure|E] [kingdom|E] of the [GetTitleByKey('e_serbia').GetName]"
  establish_serbian_empire_bosnia_stretch_tt: "If all of [GetTitleByKey('d_bosna').GetName], [GetTitleByKey('d_lower_bosna').GetName] and [GetTitleByKey('d_usora').GetName] are [completely_controlled|E], [GetTitleByKey('k_bosnia').GetName] will be created as a constituent [de_jure|E] [kingdom|E] of the [GetTitleByKey('e_serbia').GetName]"
  establish_serbian_empire_decision_extra_tooltip: "Conquering the [de_jure|E] capital of [GetTitleByKey('d_lower_bosna').GetName], [GetTitleByKey('d_lower_bosna').GetName], [GetTitleByKey('d_lower_bosna').GetName] and [GetTitleByKey('d_lower_bosna').GetName] will allow the Serbian Empire to integrate these kingdoms under its de jure hierarchy, as a "
  ktv_events.0323.t: "Emperor and Autokrator"
  ktv_events.0323.desc: "The Roman Empire is weak, incapable of defending itself - and its neighbours - from external threats. From the ruins of this outdated empire, we shall take their place, as the Emperor and Autokrator of all Serbia and Romania!"
  ktv_events.0323.a: "And the empires of old will know my might!"
  ktv_events.0323.b: "Let's make sure we can adequately replace this dying empire."
  ktv_events.0324.desc: "Forged through conquest by [founder.GetName], a Serbian empire has been declared, seeking to absorb the legacy of Eastern Rome as its own, as a new bastion against external threats."
  ktv_events.0324.a: "They certainly have spirit."
  ktv_events.0325.t: "Hellas Conquered"
  ktv_events.0325.desc: "Long ago, our ancestors migrated deep into Hellas, settling down even to the Peloponnese. Now that our imperial might has conquered these lands, they shall become part of our great empire."
  ktv_events.0325.a: "The eagle rises!"
  ktv_events.0326.t: "Crete Captured"
  ktv_events.0326.desc: "The island of Crete, a remnant of the Purple Phoenix, has been taken by our mighty eagle."
  ktv_events.0326.a: "That is one way to assert our presence in the Mediterranean."
  ktv_events.0327.t: "Bulgaria Subdued"
  ktv_events.0327.desc: "Bulgars are known to have ambitions of their own, having come into conflict with Byzantium and carved out their own empire. Their ambition, however, is better used to serve our interests, as we have captured Tarnovgrad, spiritual capital of Bulgaria; through this capture, Bulgaria shall come under the fold of the eagle."
  ktv_events.0327.a: "Our side of the Danube is secure."
  ktv_events.0328.t: "The Eternal City"
  ktv_events.0328.desc: "Constantiople, the grand capital of the Roman Empire, has been captured. As the cross of the Romans gave way to the banner of the eagle, our proclamation of succession of the Roman legacy appeared complete. With this grand city in our hand, a clear dilemma formed: Should this ancient capital be the seat of power for our empire, or should [current_capital.GetNameNoTierNoTooltip] usurp its place and prestige?"
  ktv_events.0328.a: "There is no reason to disrupt the status quo.."
  ktv_events.0328.b: "The City of the World's Desire shall be our grand capital."
  ktv_events.0328.c: "Strip it of all its wealth; [current_capital.GetNameNoTierNoTooltip] shall be the new Rome."

  e_bulgaria: "Bulgaria"
  e_bulgaria_adj: "Bulgarian"
  cn_boulgaria: "Boulgaria"
  bulgaria_formation_modifier: "Ascendancy of Great Bulgaria"
  establish_bulgarian_empire_decision: "Establish a Bulgarian Empire"
  establish_bulgarian_empire_decision_confirm: "A tsardom to rival Byzantium!"
  establish_bulgarian_empire_decision_desc: "Our migrations have taken us here, where the Roman Empire called Moesia, where we intended to make our home. Of course, with the Empire breathing down our necks, this home can never be secure. We must prove ourselves a capable rival, and stand up to the Rhomaioi's desire to retake this land."
  establish_bulgarian_empire_decision_tooltip: "Bulgaria becomes a [de_jure|E] [empire|E]"
  establish_bulgarian_empire_decision_effect_tt: "Every [completely_controlled|E] or held [kingdom|E]-tier [title|E] in the region of [GetGeographicalRegion('custom_south_slavia').GetName] and [GetGeographicalRegion('custom_carpathia').GetName] becomes [de_jure|E] part of [bulgarian_empire.GetName]"
  establish_bulgarian_empire_have_other_kingdoms: "Hold at least one other [kingdom|E]-tier [title|E] that is not [GetTitleByKey('k_bulgaria').GetName]"
  ktv_events.0321.t: "An Empire of the Bulgars"
  ktv_events.0321.desc: "Through many battles and wars, we have solidified our position at the gates of the Byzantine Empire, and our victories have shown that we are equal, if not superior, to the emperors ordained by God. It is only right that, through our prowess, we become an empire unto ourselves."
  ktv_events.0321.a: "Let the Romans quake in fear!"
  ktv_events.0321.b: "This shall be an empire that lasts."
  ktv_events.0322.desc: "Following a string of victories against the Byzantine Empire, [founder.GetName] has proclaimed the vast expanse of land carved out by [founder.GetHerHis] people to be a Bulgarian Empire, an equal to the Emperor in Constantinople."
  ktv_events.0322.a: "Worrying."

  e_celtica: "Celtica"
  e_celtica_adj: "Celtic"
  establish_celtic_empire_decision: "Unite the Celts"
  establish_celtic_empire_decision_confirm: "The Celts shall rise again!"
  establish_celtic_empire_decision_desc: "With a history spanning millenia, the Celts have been mainstays in Europe, before the age of great kingdoms and empires. Though many invasions have driven the Celts to a sliver of land their ancestral peoples once inhabited, their customs and way of life persisted. Under a strong leader to unite the Celtic world, a new empire can be forged to restore prestige to these peoples."
  establish_celtic_empire_decision_tooltip: "Celtica becomes a [de_jure|E] [empire|E]"
  establish_celtic_empire_hen_ogledd_complete_tt: "The [GetTitleByKey('k_ogledd').GetName] will be established as part of Celtica"
  establish_celtic_empire_hen_ogledd_incomplete_tt: "If [GetGeographicalRegion('custom_hen_ogledd').GetName] is [completely_controlled|E], the [GetTitleByKey('k_ogledd').GetName] will be established as part of Celtica"
  celtic_empire_custom: "Every county in Celtica"
  ktv_events.0031.t: "Empire of all Celts"
  ktv_events.0031.desc: "Once, the Celts live in an expanse from Ireland to Asia Minor. With time, their dominions have been diminished, but under a strong ruler, the Celtic peoples will band together, a strength to be contended with."
  ktv_events.0031.a: "We will rise!"
  ktv_events.0032.desc: "The Celtic peoples have united under a common banner, their leaders ambitious to return their peoples to lands their ancestors once lived."
  ktv_events.0032.a: "The Celts strike back..."

