  dismantle_utrecht_bishopric_decision_confirm: "Dismantle the Sticht"
  dismantle_utrecht_bishopric_decision_desc: "The bishop of Utrecht, not content with the city, has claimed dominion lands across the Zuiderzee, calling them Oversticht after the bishopric! We must dismantle this egregious abuse of ecclesiastical authority in the secular realm, and ensure Utrecht belongs to the rightful owner - me."
  dismantle_utrecht_bishopric_decision_tooltip: "Dismantle the duchy of Utrecht and incorporate Nedersticht into either Holland or Gelre."

