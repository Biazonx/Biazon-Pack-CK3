ktv_events.4101.t: "$found_lan_xang_decision$"
ktv_events.4101.desc: "The Kingdom of Ten Thousand Elephants, Lan Xang, shall prosper in the highlands, away from the yoke of those who have ruled over these lands before us."
ktv_events.4101.a: "Glory to us!"
ktv_events.4101.b: "This is the genesis of a new people."

