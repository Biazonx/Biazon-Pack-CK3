  ktv_events.1017.t: "Convening the Clans in Agadez"
  ktv_events.1017.desc: "For too long, the tribes and clans of our people have been embroiled in petty disputes for far too long. Under a strong ruler and a just system to resolve these rivalries, we can work together and forge a powerful realm amidst this landscape."
  ktv_events.1017.a: "The clans shall stand united."
  ktv_events.1018.desc: "The Amazigh tribes at the Aïr Mountains have put aside their rivalries and united under [founder.GetShortUIName], who proclaimed a [air.GetName]"
  ktv_events.1018.a: "Let's see how long they can remain united."

