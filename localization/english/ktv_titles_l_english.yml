  ktv_events.0231.t: "Unifying the Old Continent"
  ktv_events.0231.desc: "A continent of great history, Europe has been home to many peoples, religions, cultures and languages. We united, cooperated, squabbled, and feuded with one another. Though none have the vision to see it, a unified continent, be it by diplomacy or by force, is a fearsome power to be reckoned with. Today, however, as I convened with the elites of the realm, the dream is finally realised - a union of all Europe is now a reality."
  ktv_events.0231.a: "#italic In varietate unitas#!"
  ktv_events.0232.desc: "The Old Contient has been united by a powerful ruler. It promises to be one of the great powers, rivalling even China - as long as the diverse peoples of the continent can stay together."
  ktv_events.0232.a: "Interesting."
