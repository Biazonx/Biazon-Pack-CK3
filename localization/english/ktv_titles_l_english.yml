found_lan_xang_decision: "Land of the Ten Thousand Elephants"
found_lan_xang_decision_desc: "With our wealth and power, we shall seek a kingdom among the mountains, away from the yoke of Angkor and Dvaravati."
found_lan_xang_decision_tooltip: "You will found the Kingdom of Lan Xang"
found_lan_xang_decision_confirm: "Confirm."
