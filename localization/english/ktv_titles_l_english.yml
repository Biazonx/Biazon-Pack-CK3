  reclaim_sogdian_legacy_decision: "Reclaim Sogdian Legacy"
  unite_the_sogdians_decision: "Unite the Sogdian Cities"
  unite_the_sogdians_decision_tooltip: "Make Sogdiana a [de_jure|E] [kingdom|E]"
  unite_the_sogdians_decision_confirm: "Sogdiana prevails!"
  reclaim_sogdian_legacy_decision_desc: "Sogdiana was once a long standing civilization of many city states dotting the region, remembered most fondly by those who fled it after ever encroaching invaders. We must restore Sogdiana to greatness."
  unite_the_sogdians_decision_desc: "The disunited Sogdian cities are easy prey for any conquerors looking to affirm rule over all Persia. We must band together and stand up for our own sake."
  unite_sogdiana_ferghana_valley_stretch: "If [completely_controlled|E], [ferghana.GetName] becomes part of [sogdiana.GetName]"
  ktv_events.4203.t: "United Sogdiana"
  ktv_events.4203.desc: "We have united the disunited Sogdian polities. Now, we shall stand strong as one."
  ktv_events.4203.a.restore_sogdian: "Sogdian identity shall have a place again."
  ktv_events.4203.a: "Stand tall."
  ktv_events.4204.desc: "The polities of Sogdiana has united under a powerful ruler."
  ktv_events.4204.a: "Interesting"
  
  reform_bactria_kingdom_decision: "Reforge a Bactrian Kingdom"
  reform_bactria_kingdom_decision_confirm: "Bactria stands!"
  reform_bactria_kingdom_decision_tooltip: "Make Bactria a [de_jure|E] [kingdom|E]" 
  reform_bactria_kingdom_decision_desc: "Bactria is a land with a storied history, one of the perfect Iranian lands according to Zoroastrian belief, and home to a small kingdom that would later be the core of a great Hellenistic kingdom. We should claim this legacy and forge a Bactrian kingdom."
  form_bactrian_kingdom_badakhshan_stretch: "If [completely_controlled|E], [badakhshan.GetName] becomes [de_jure|E] part of [bactria.GetName]"
  ktv_events.4205.t: "Reforging a Bactrian Kingdom"
  ktv_events.4205.desc: "We have reforged a Bactrian kingdom in its old core region. Perhaps this is just a prelude to greatness."
  ktv_events.4205.a: "Merely a first step towards reaffirming Bactrian supremacy."
  ktv_events.4206.desc: "A Bactrian kingdom has been proclaimed."
  ktv_events.4206.a: "A spirited bunch."

  reform_ferghana_principality_decision: "Reform the Principality of Ferghana"
  reform_ferghana_principality_decision_confirm: "The Valley stands strong!"
  reform_ferghana_principality_decision_tooltip: "Make Ferghana a [de_jure|E] [kingdom|E]"
  reform_ferghana_principality_decision_desc: "The Valley of Ferghana is a fertile land among these mountains. It could be the foundation for a principality, as the past has shown."
  ktv_events.4209.t: "Principality of Ferghana"
  ktv_events.4209.desc: "With my grip on the Ferghana Valley and my prestige, I could now declare the formation of a principality in the valley."
  ktv_events.4209.a: "This time we will last."
  ktv_events.4210.desc: "The ruler of the Ferghana Valley has declared itself a great principality."
  ktv_events.4210.a: "Let's see how long they last."

  reform_zunbil_kingdom_decision: "Reforge the Zunbil Kingdom"
  reform_zunbil_kingdom_decision_confirm: "Zun guide us!"
  reform_zunbil_kingdom_decision_tooltip: "Make Zabulistan a [de_jure|E] [kingdom|E]"
  reform_zunbil_kingdom_decision_desc: "The Zunbils held a kingdom of their own in service of Zun, the sun god. With their fire extinguished by outsiders who seek to stamp out the god, we must carry on their legacy and be the utmost stewards to Zun."
  form_zunbil_decision_effect_sistan_stretch_goals_tt: "If [completely_controlled|E], [sistan.GetName] becomes part of [zabulistan.GetName]"
  ktv_events.4211.t: "A Zunist Kingdom"
  ktv_events.4211.desc: "Holding our own in the rough landscape of Zabulistan, we have successfully claimed succession over the Zunbil Kingdom."
  ktv_events.4211.a: "All hail Zun!"
  ktv_events.4212.desc: "[founder.GetShortUIName] has consolidated rule over Zabulistan and proclaimed a bastion for worshippers of Zun."
  ktv_events.4212.a: "We'll see how their god protects them."

