  form_air_tuareg_decision_desc: "The disparate Amazigh tribes and clans inhabiting the environs of the Aïr Mountains are often in dispute, never recognising a powerful tribe's dominion over the rest. We need to put an end to these tribal rivalries and disputes in order to aspire to greatness."
  form_air_tuareg_decision_tooltip: "Aïr becomes a [de_jure|E] [kingdom|E]"
