integrate_transylvania_into_romania_decision: "Integrate Transylvania"
integrate_transylvania_into_romania_decision_desc: "Transylvania is a rich territory inhabited by many Vlachs, long struggled under the grasp of Magyar oppressors. We must unite them under our banner."
integrate_transylvania_into_romania_decision_tooltip: "Integrate Transylvania into de jure Romania"
integrate_transylvania_into_romania_decision_confirm: "Awaken, Romania!"
integrate_timok_valley_into_romania_decision: "Integrate Timok Valley"
integrate_timok_valley_into_romania_decision_desc: "The valley across the Danube is home to a sizable Vlach population. We should seek to integrate it to our realm."
integrate_timok_valley_into_romania_decision_tooltip: "Integrate the Timok Valley into de jure Romania"
integrate_timok_valley_into_romania_decision_confirm: "Awaken, Romania!"

form_romania_empire_decision: "Proclaim a Romanian Empire"
form_romania_empire_decision_desc: "While many have aspired to claim the glory of Rome, only we are its true descendants. By asserting our imperial ambitions can we proclaim our birthright as the children of Rome."
form_romania_empire_decision_desc_nobyz: "With the last vestiges of the Roman Empire extinguished, many pretenders claim the imperial crown, but only we are its true descendants. By asserting an imperial Romania can we proclaim our birthright as the children of Rome."
form_romania_empire_decision_tooltip: "Elveate Romania to an empire."
form_romania_empire_decision_confirm: "We are the true inheritors of Rome!"
