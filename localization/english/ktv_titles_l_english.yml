  ktv_events.0217.desc: "As I established myself as a notorious raider in the middle of the Meditteranean, one thing is clear - while the entire ocean is our oyster, we must dedicate the most effort in one particular region lest we overexert ourselves. The question is, where should our focus lie?"
  ktv_events.0217.a: "The Italian Peninsula shall be our focus"
  ktv_events.0217.b: "North Africa is just within our grasp"
  ktv_events.0217.c: "The coasts of Egypt and Arabia are rather lucrative"
  ktv_events.0217.d: "The Byzantine Empire holds many profitable opportunities"
  ktv_events.0217.e: "The status quo works for us."
  ktv_events.0218.desc: "A prominent pirate has proclaimed Malta a new hub for raid and piracy, poised to impact commerce and movement in the region for years to come."
