  unite_nusantara_decision_desc: "The islands are littered with many proclaiming to be reincarnation of a god, deluding the gullible to hand them tribute. By forcing these false gods to bend their knee, I can show them only one true Devaraja exists - me."
  form_nusantara_hegemony_decision.completely_control_X_percents_from_world_asia_southeast_islands: "Every [county|E] in [GetGeographicalRegion('world_asia_southeast_islands').GetName] is controlled either by you, your [tributaries|E], or your [confederation|E] members."
  form_nusantara_hegemony_decision.completely_control_X_percents_from_world_asia_malaysia: "Every [county|E] in [GetGeographicalRegion('world_asia_malaysia').GetName] is controlled either by you, your [tributaries|E], or your [confederation|E] members."
  unite_nusantara_decision_titles_tt: "Every [empire|E] [title|E] in [GetGeographicalRegion('world_asia_southeast_islands').GetName] and [GetGeographicalRegion('world_asia_malaysia').GetName] becomes [de_jure|E] part of [GetTitleByKey('h_nusantara').GetName]"
  ktv_events.4021.t: "The Thalassocracy"
  ktv_events.4021.desc: "The diverse peoples of these wealthy islands are capable of great things. Empires have come to expand throughout the expanse of Nusantara, yet none have achieved such a level of dominance as to have the entire region under their grasp. Today, I have made that a reality, and all Nusantara now serve one banner. Mine."
  ktv_events.4021.a: "With these peoples, we go from strength to strength."
  ktv_events.4022.desc: "Through a period of expansion and integration, the islands of Nusantara have been united under a singular ruler. This unified thalassocracy is rumoured to be a land of great wealth."
  ktv_events.4022.a: "Suvarnabhumi was real, after all."
  restore_eranshahr_decision: "Restore the Glory of Persia"
  restore_eranshahr_decision_confirm: "The fire burns bright."
  restore_eranshahr_decision_tooltip: "Restore the glory of the past Persian empires and proclaim the [hegemony|E] of Eranšahr"
  restore_eranshahr_decision_desc: "Persia has long been a great power, its cultural influence felt in the classical world; stewarded by the Achaemenids, then Seleukids, then Arsacids, then Sassanids, it has been projected throughout the world for centuries. Now, however, Persia found herself in tough times, with increasing encroachment of Islam and unruly nomads seeking to carve out a piece of our empire. What Persia needs is a mighty ruler to restore her to greatness and reach the heights her ancestors have once reached."
  restore_eranshahr_decision_titles_tt: "Every [empire|E] [title|E] in [GetGeographicalRegion('custom_eranshahr').GetName] becomes [de_jure|E] part of [GetTitleByKey('h_eranshahr').GetName]. Additional [empire|E] and [kingdom|E] titles may be created to appropriately split boundaries."
  restore_eranshahr_bahrain_complete_tt: "As [GetGeographicalRegion('custom_al_bahrein').GetName] is completely controlled, it will be integrated into [GetTitleByKey('h_eranshahr').GetName] as a subordinate [de_jure|E] [kingdom|E]"
  restore_eranshahr_bahrain_tt: "If [GetGeographicalRegion('custom_al_bahrein').GetName] is completely controlled, it will be integrated into [GetTitleByKey('h_eranshahr').GetName] as a subordinate [de_jure|E] [kingdom|E]"
  eranshahr_formation_modifier: "Lion of Persia"
  eranshahr_formation_modifier_desc: "This dynasty is renowned for restoring the Persian Empire to her glory days."
  form_eranshahr_must_end_struggle_trigger: "The [persian_struggle|E] must be resolved first"
  ktv_events.4221.t: "The Rekindled Flame of Eranšahr"
  ktv_events.4221.desc: "It is an auspicious day - for it is the day that Persia reaffirmed her position as one of the greatest powers in the world, matching the heights of the empires of old. From the hills of Macedonia to the Indus valley, from the Scythian steppes to the Mesopotamian heartland, the banner of the lion and sun stood tall, a sign of the expanse of Eranšahr. And I, [eranshahr_emperor.GetShortUIName], am truly the King of Kings, King of the Four Corners of the Universe, the ruler of this mighty empire."
  ktv_events.4221.a: "This will be a new golden age!"
  ktv_events.4222.desc: "Through a period of expansion and integration, [eranshahr_emperor.GetShortUIName] has declared the return of a great Persian empire, emulating the empires of old."
  ktv_events.4222.a: "The lion roars again."
