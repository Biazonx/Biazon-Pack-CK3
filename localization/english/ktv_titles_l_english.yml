  establish_azerbaijan_decision: "Establish Azerbaijan"
  establish_azerbaijan_decision_confirm: "This shall be our new home."
  establish_azerbaijan_decision_desc: "Having made the journey from our original homeland, through many battles and wars, we can now finally call a piece of Persia our home."
  establish_azerbaijan_decision_tooltip: "Azerbaijan becomes a [de_jure|E] [kingdom|E]"
  ktv_events.2011.t: "A Home in Persia"
  ktv_events.2011.desc: "Through a series of migrations, I have finally found this place - known to the Persians as #emp Ādurbādagān#!, and a region steeped in history - fit to be a new home for my people."
  ktv_events.2011.a: "We shall build a mightly realm here."
  ktv_events.2012.desc: "A Turkic people have conquered what was once known as Atropatene - they now call it #emp Azerbaijan#! - and proclaimed a new kingdom."
  ktv_events.2012.a: "Interesting."

  establish_kurdistan_kingdom_decision: "Establish the Kingdom of $k_kurdistan$"
  establish_kurdistan_kingdom_decision_confirm: "A kingdom of our own!"
  establish_kurdistan_kingdom_decision_desc: "Through fierce fighting and decades stuck between great empires, we have finally carved out a piece of Persia for our home."
  establish_kurdistan_kingdom_decision_tooltip: "Kurdistan becomes a [de_jure|E] [kingdom|E]"
  ktv_events.2006.t: "Foundation of $k_kurdistan$"
  ktv_events.2006.desc: "Through great struggle and fighting, squished between great empires, I can finally found a kingdom for my people to call their home."
  ktv_events.2006.a: "And may this kingdom last."
  ktv_events.2007.desc: "Through great struggle and fighting, squished between great empires, Kurdish warriors have rallied around [founder.GetName] and found a kingdom of their own."
  ktv_events.2007.a: "They are still stuck between a rock and a hard place..."
  parent_culture_kurdish_tt: "Any parent [culture|E] is $kurdish$."

  establish_caucasus_decision: "Bulwark of the Caucasus"
  establish_caucasus_decision_confirm: "The mountains are our home, our sanctuary - our power."
  establish_caucasus_decision_desc: "The Caucasian Mountains are home to many peoples and faiths, and at the confluence of East and West, it has been the stage for many an empire seeking to dominate it and its peoples. It is time a formidable ruler unite the mountains under a single sceptre, and profess that the mountains are most unassailable. It shall no longer bow to any emperor - not the Romans, not the Persians, not anyone else."
  establish_caucasus_decision_tooltip: "Form an empire straddling the Caucasus Mountains."
  elevate_caucasia_decsion_ciscaucasia_incomplete: "If [completely_controlled|E], the [ciscaucasus.GetName] will become [de_jure|E] part of [caucasus.GetName] undivided."
  elevate_caucasia_decsion_ciscaucasia: "If [completely_controlled|E], the [ciscaucasus.GetName] will become [de_jure|E] part of [caucasus.GetName]. If only the hilly duchies of [alania.GetName] and [ciscaucasia.GetName] are [completely_controlled|E], the steppe duchies of [azov.GetName] and [khazaria.GetName] will become [de_jure|E] part of a new kingdom under the [steppe_empire.GetName]"
  elevate_caucasia_decsion_pontus: "If [completely_controlled|E], the [pontus.GetName] will become [de_jure|E] part of [caucasus.GetName]."

  nick_athleta_christi: "Athleta Christi"
  nick_athleta_christi_desc: "As a formidable and exemplary military leader who fought against heretics and heathens in service of Christendom, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] is proclaimed a Champion of Christ, much like Saint George."
  rival_claimed_basileus: "[TARGET_CHARACTER.GetShortUIName|U] claimed to be the Basileus of all the East, styling [TARGET_CHARACTER.GetHerHim]self in the same way as - and challenging the authority of - [CHARACTER.GetShortUIName]."
  rival_claimed_basileus_corresponding: "[CHARACTER.GetShortUINamePossessive|U] authority was challenged by the upstart [TARGET_CHARACTER.GetShortUIName|U], who styled [TARGET_CHARACTER.GetHerHim]self Basileus of all the East."
  rival_claimed_shahanshah: "[TARGET_CHARACTER.GetShortUIName|U] claimed to be the King of Kings, styling [TARGET_CHARACTER.GetHerHim]self in the same way as - and challenging the authority of - [CHARACTER.GetShortUIName]."
  rival_claimed_shahanshah_corresponding: "[CHARACTER.GetShortUINamePossessive|U] authority was challenged by the upstart [TARGET_CHARACTER.GetShortUIName|U], who styled [TARGET_CHARACTER.GetHerHim]self King of Kings."
  custom_caucasia_basileus_male: "$emperor_feudal_male_greek$"
  custom_caucasia_basileus_female: "$emperor_feudal_female_greek$"
  custom_caucasia_shahanshah_male: "$emperor_feudal_male_iranian_group$"
  custom_caucasia_shahanshah_female: "$emperor_feudal_female_iranian_group$"

  ktv_events.2015.t: "Bulwark of the Caucasus"
  ktv_events.2015.desc: "Under my sword and sceptre, the peoples of the Caucasus Mountains have been united under one banner - #emp my#! banner. Our lands impregnable and our peoples prosperous, no longer shall we tremble under the heels of empires of all, but we shall challenge them as equals."
  ktv_events.2015.a: "They will sing songs of me for centuries to come!"
  ktv_events.2015.b: "I shall be remembered as the one who forges this expansive realm!"
  ktv_events.2015.c: "We were dwarfed, but I have brought us back to glory."
  ktv_events.2015.d: "I am a champion of Christ, as Saint George was!"
  ktv_events.2015.e: "As Saint George has slain a dragon, so too shall I slay the dragons of heathenry!"
  ktv_events.2015.fallback: "I have no need for grandiose epithets."
  ktv_events.2016.desc: "[founder.GetName] has unified kingdoms both sides of the Caucasus Mountains into a fledging empire, seeking to rival both Rome and Persia."
  ktv_events.2016.a: "How brave."
  ktv_events.2017.t: "Styling Myself"
  ktv_events.2017.desc: "Now that I have forged an empire among these mountains, long considered peripheral by the great empires that once conquered them, I must now address one problem - how I should be addressed, for this is also how I will project my image outward, towards the very empires that once dominated us. Should I claim to be a #emp;bold Basileus#!, to rival the Roman Empire, or #emp;bold Shahanshah#!, contending with the King of Kings of Persia?"
  ktv_events.2017.basileus: "I shall style myself the #emp;bold Basileus#! of all the East!"
  ktv_events_2017_styled_self_basileus: "You adopt #emp;bold Basileus#! as your title of address."
  ktv_events.2017.shahanshah: "I shall style myself the #emp;bold Shahanshah#!, the #emp King of Kings#!!"
  ktv_events_2017_styled_self_shahanshah: "You adopt #emp;bold Shahanshah#! as your title of address."
  ktv_events.2017.nope: "The empires that once daunted us are already shaken enough."
  ktv_events.2018.t: "Beyond the Gates of Alexander"
  ktv_events.2018.desc: "On the northern side of the Caucasian Mountains, our expanse stretched up to the confluence of the Volga and the Don. While the Alans and a variety of peoples live near the mountain, the steppes near the rivers are unruly and sparse territory, frequented by few but nomads and herders. Perhaps there need to be some change to organization, to ensure we can affirm our rule over it?"
  ktv_events.2018.a: "Having a formal separation of these territories will do no harm."
  ktv_events.2018.a.viceroy: "A viceroy shall be appointed to rule over the steppe lands in my name."
  ktv_events.2018.b: "The hinterland is still part of our empire, this is unnecessary."
  ktv_events.2018.bad: "Such unruly and desolate lands have no place in our empire."

  establish_panyupayana_decision: "Unite the Barangays"
  establish_panyupayana_decision_confirm: "Stronger together."
  establish_panyupayana_decision_desc: "The people of these islands have long lived in disparate villages and city-states dotting river estuaries and coastlines. While there exists some level of confederating between these barangays, only by banding the strength of all of us together can we assert a powerful maritime presence outwards."
  establish_panyupayana_decision_tooltip: "Unite the barangays under a [de_jure|E] [empire|E]"
  unite_the_barangays_absorb_confederates_and_tributaries: "All [tributaries|E], [confederation|E] members and [tributaries|E] of [confederation|E] members with their capital within [GetGeographicalRegion('custom_panyupayana').GetName] will become vassals of [philippines.GetName]."
  found_panyupayana_decision_liuqiu: "If [completely_controlled|E], [liuqiu.GetName] will become [de_jure|E] part of [philippines.GetName]."

  ktv_events.4011.t: "The Barangays Unified"
  ktv_events.4011.desc: "Maritime peoples of these fair islands have lived in small #emp barangays#!, dotted across the coast and along the rivers. Uniting in confederations, they often elect a [Glossary( 'Datu', 'DATU_GLOSS' )] among their own, serving as a paramount leader for such alliances. In the same manner, I have unified the confederations together, and among all the paramount [Glossary( 'datu', 'DATU_GLOSS' )], I shall be the most paramount of them all."
  culture_acceptance_gain_united_barangays: "United Barangays"
  ktv_events.4011.a: "Here begins a golden age for the barangays."
  ktv_events.4012.desc: "[founder.GetName] has been proclaimed Paramount [Glossary( 'Datu', 'DATU_GLOSS' )] of all the barangays of what [founder.GetSheHe] now called [founder.GetPrimaryTitle.GetName], a name signifying the diverse cultural and religious makeup of the archipelago."
  ktv_events.4012.a: "Interesting."

  form_maguindanao_decision: "Form a Sultanate over Minadao"
  form_maguindanao_decision_confirm: "Proclaim the Sultanate"
  form_maguindanao_decision_desc: "Trade connections with Aceh and Borneo brought the exotic religion of Islam to the barangays. We have determined that it is the only way forward, and that our fellows should be united under the banner of the Prophet."
  form_maguindanao_decision_tooltip: "Maguinadao becomes a [de_jure|E] kingdom"
  form_maguindanao_sandao_tt: "If [sandao.GetName] is [completely_controlled|E], [maguindanao.GetName] becomes [de_jure|E] [liege|E]"

  form_pegu_kingdom_decision: "Rebuke Burmese Encroachment in the Irrawaddy Delta"
  form_pegu_kingdom_decision_confirm: "Unite under the haṃsa."
  form_pegu_kingdom_decision_desc: "For some time, the Burmese [GetTitleByKey('k_pagan').GetName] has sought to claim dominion over the Irrawaddy Delta, a traditional stronghold of the Mon, be it through military force or through tributaries. No longer - we shall forge a kingdom of our own, as equals to the self-proclaimed God-King."
  form_pegu_kingdom_decision_tooltip: "You will found a kingdom in the Irrawaddy Delta."
  form_pegu_kingdom_decision.completely_control_X_percents_from_lower_burma: "You must [completely_control|E] at least #V 75%#! of all [counties|E] from [GetGeographicalRegion('custom_lower_burma').GetName]"
  ktv_events.4013.t: "At the Irrawaddy Delta"
  ktv_events.4013.desc: "The Burmese kings of [GetTitleByKey('k_pagan').GetName] have long eyed the Irrawaddy Delta where we have long made our home. With the unification of the Delta, we will stand up against their ambitions, and eclipse their false god-king's radiance."
  ktv_events.4013.a: "The delta is ours."
  ktv_events.4014.desc: "The Mon peoples of the Irrawaddy Delta has united under [founder.GetShortUIName] in the newly-proclaimed Kingdom of Hanthawaddy."
  ktv_events.4014.a: "Interesting."

  found_shan_federation_decision: "Found the Shan State"
  found_shan_federation_decision_confirm: "$form_siam_kingdom_decision_confirm$"
  found_shan_federation_decision_desc: "After centuries of wandering, I believe my people have finally found a place to call their own, among these formidable mountains where they will be safe. They only need a trusted ruler to help them reach their potential."
  found_shan_federation_decision_tooltip: "Make Shan a [de_jure|E] [kingdom|E]"
  form_shan_kingdom_decision.completely_control_X_percents_from_shan: "Every [county|E] in [GetGeographicalRegion('custom_shan').GetName] is controlled either by you, your [tributaries|E], or your [confederation|E] members."
  form_shan_kingdom_decision_effect_tagaung_stretch_goals_tt: "If [completely_controlled|E], [tagaung.GetName] will become [de_jure|E] part of [shan.GetName]"
  form_shan_kingdom_decision_effect_tengchong_stretch_goals_tt: "If [completely_controlled|E], [tengchong.GetName] will become [de_jure|E] part of [shan.GetName]"
  ktv_events.4103.t: "The Shan Confederation"
  ktv_events.4103.desc: "While other Tai tribes have settled down in Dvaravati or the highlands of the Phū Lūang, we have determined the highlands of Upper Myanmar to be a fitting home, where we will be safe amidst these mountains. And as the leader of this confederation of tribes, it is my responsibility to protect them and lead them to new heights."
  ktv_events.4103.a: "A home at last."
  ktv_events.4103.b: "$ktv_events.4101.b$"
  shan: "Shan"
  shan_noun: "Shan"
  shan_collective_noun: "Shan"
  shan_preix: "Shan"

  # Arabia
  form_hejaz_decision_overlord: "Unite the Sharifates of Hejaz"
  form_hejaz_decision: "Found the Kingdom of Hejaz"
  form_hejaz_decision_confirm: "Found Hejaz"
  form_hejaz_decision_desc_overlord: "The two sharifates governing Mecca and Medina have always squabbled against each other, while both relying on being subordinate to my great realm. Perhaps it is time to formalise control over the western coast of Arabia."
  form_hejaz_decision_desc: "We have controlled the cities of Mecca and Medina - the two most holy city in all of Islam. From Hejaz we shall forge a great kingdom."
  form_hejaz_decision_tooltip: "Make Hejaz a [de_jure|E] [kingdom|E]."
  form_hejaz_kingdom_decision.completely_control_X_percents_from_hejaz: "You must [completely_control|E] at least #V 70%#! of all [counties|E] from [GetGeographicalRegion('custom_hejaz').GetName]"
  hejaz_sharifate_transfer_vassals: "Vassals of [duchy|E] tier or lower within [GetGeographicalRegion('custom_hejaz').GetName] will be transferred to your chosen ruler."
  ktv_events.1004.t: "On the West Coast"
  ktv_events.1004.desc: "I have declared a kingdom spanning over Hejaz, taking custodianship over the two most holy cities in Islam."
  ktv_events.1004.desc.empire: "\n\nAs an imperial ruler, it is time I put an end to the squabble between the sharifs of Medina and Mecca, and elevate one above the other."
  ktv_events.1004.a: "All is well in Hejaz"
  ktv_events.1004.b: "The Sharif of Medina shall have dominion over all Hejaz"
  ktv_events.1004.c: "The Sharif of Mecca shall have dominion over all Hejaz"
  rival_elevated_for_hejaz: "[TARGET_CHARACTER.GetShortUIName|U] was elevated as the governor of all Hejaz, affirming [TARGET_CHARACTER.GetHerHis|U] sharifate's supremacy in a long-running rivalry."
  rival_elevated_for_hejaz_corresponding: "[CHARACTER.GetShortUIName|U] was humiliated by the decision to appoint [TARGET_CHARACTER.GetShortUIName|U] as the governor of all Hejaz."

  form_bahrain_decision: "Consolidate Bahrain"
  form_bahrain_decision_desc_qarmatian: "The false imam [GetTitleByKey('d_shiite').GetHolder.GetShortUIName] claims to be the leader of all Shi'ites, but we know in our hearts that our incoming Mahdi is the true imam. We must secure a power base in Bahrain and strike back against these unbelieving heretics, lest they mislead the faithful into Jahannam."
  form_bahrain_decision_desc_qarmatian_revival: "Though the previous [GetFaithByKey('qarmatian').GetAdjective] struggle against the false imam [GetTitleByKey('d_shiite').GetHolder.GetShortUIName] failed, we shall take up our predecessor's mantle and cause, consolidate the riches of Bahrain and strike fear into the hearts of heretics."
  form_bahrain_decision_desc: "The eastern coast of Arabia facing the Gulf is home to many seafarers and traders, and hosted many great intellectuals throughout history. Through consolidating this territory, we can become a powerful economic power."
  form_bahrain_decision_tooltip: "Make Bahrain a [de_jure|E] [kingdom|E]"
  form_bahrain_decision_confirm: "Unite the Two Seas"
  form_bahrain_kingdom_decision.completely_control_X_percents_from_bahrain: "You must [completely_control|E] at least #V 70%#! of all [counties|E] from [GetGeographicalRegion('custom_al_bahrein').GetName]"
  ktv_events.1006.t: "Bahrain Consolidation"
  ktv_events.1006.desc.qarmatian: "The false imam [GetTitleByKey('d_shiite').GetHolder.GetShortUIName] claims to be the leader of all Shi'ites, but we know in our hearts that our incoming Mahdi is the true imam. We shall build Bahrain to be rich and prosperous, and strike back against these unbelieving heretics, lest they mislead the faithful into Jahannam."
  ktv_events.1006.desc.qarmatian_revival: "Though the previous [GetFaithByKey('qarmatian').GetAdjective] struggle against the false imam [GetTitleByKey('d_shiite').GetHolder.GetShortUIName] failed, we shall take up our predecessor's mantle and cause, consolidate the riches of Bahrain and strike fear into the hearts of heretics."
  ktv_events.1006.desc: "Home to many seafarers, traders and intellectuals, the land of Bahrain has the potential to grow strong and influence the region. In my hands, I will make that a reality."
  ktv_events.1006.a: "Set sail!"

  form_oman_decision: "Elevate Oman"
  form_oman_decision_confirm: "Victory from God!"
  form_oman_decision_desc: "Since ancient times, Oman at the corner of the Arabian Peninsula has been a land of prosperous agriculture and stability, oft independent from the polities of the rest of the peninsula. Though isolated by the mountains and the vast desert, trade was robust, especially with the Indian subcontinent. By elevating the status of Oman and demonstrating our ambition, we can gain the respect of our regional neighbours and further our agendas."
  form_oman_decision_tooltip: "Make Oman a [de_jure|E] [kingdom|E]"
  ktv_events.1008.t: "Ascension of Oman"
  ktv_events.1008.desc: "Since ancient times, Oman at the corner of the Arabian Peninsula has been a land of prosperous agriculture and stability, oft independent from the polities of the rest of the peninsula. Though isolated by the mountains and the vast desert, trade was robust, and with the consolidation and ascension of Oman, we can now look outward and further our agendas."
  ktv_events.1008.a: "We shall rise!"

  # Heptarchy
  elevate_wight_decision_realm_size_limit: "[realm_size|E] equal or less than #V 5#! [counties|E]"
  elevate_wight_decision: "Elevate Wight"
  elevate_wight_decision_confirm: "Arise, Wight!"
  elevate_wight_decision_desc: "Strategically located just off the coast of England, Wight provides much needed protection to the ports of Southampton and Portsmouth, as well as the Wessex capital of Winchester. I should develop the island and elevate its status to ensure this protection remains paramount - or perhaps, use it as a base to launch an invasion into England..."
  elevate_wight_decision_tooltip: "Turn the Isle of Wight into a duchy."

  restore_northumbria_decision: "Restore Northumbrian Glory"
  restore_northumbria_decision_confirm: "A new age for Northumbria!"
  restore_northumbria_decision_desc: "Though a mighty kingdom in the past, Northumbria has been repeatedly humiliated by the Norsemen invasions and eclipsed by Wessex in the south. We must return Northumbria to respectability."
  restore_northumbria_decision_tooltip: "Make Northumbria a [de_jure|E] [kingdom|E]"
  form_northumbria_kingdom_decision_effect_lancaster_stretch_goals_tt: "If [completely_controlled|E], [lancaster.GetName] will be come [de_jure|E] part of [northumbria|E]"
  form_northumbria_kingdom_decision_effect_lothian_stretch_goals_tt: "If [completely_controlled|E], [lothian.GetName] will be come [de_jure|E] part of [northumbria|E]"
  heptarchy_ascendance_humiliate_england_reqs: "There must either be no King of [GetTitleByKey('k_england').GetName], or if one exists, [GetTitleByKey('k_england').GetName] must either be paying tribute to a [suzerain|E] or has a [realm_size|E] of less than #V 14#!."
  ktv_events.0011.t: "Northumbria Ascendant"
  ktv_events.0011.desc: "Despite our struggles against both Wessex and the Norse meddlers, we have prevailed from our hardships and brought Northumbria back to respectability."
  ktv_events.0011.a: "Northumbria stands tall again."
  ktv_events.0012.desc: "[founder.GetName] has declared Northumbria to be the pre-eminent kingdom among the Anglo-Saxons."
  ktv_events.0012.a: "Interesting."

  restore_cumbria_decision: "Restore Cumbric Glory"
  restore_cumbria_decision_confirm: "Cumbria lives!"
  restore_cumbria_decision_desc: "One of many small Brythonic kingdoms dotting the Old North, and one of the last to remain standing, Ystrad Clud is beset by all sides by enemies. We must look to restore it to a respectable state."
  restore_cumbria_decision_tooltip: "Make Strathclyde a [de_jure|E] [kingdom|E]"
  ktv_events.0013.t: "Stronghold of Cumbrians"
  ktv_events.0013.desc: "Though beset by enemies at all sides, and driven back to only the Clyde, we have managed to restore respectability and power. Ystrad Clud now stands as a kingdom in its own right."
  ktv_events.0013.a: "Yr Hen Ogledd is next!"
  ktv_events.0013.b: "...and Rheged shall return to the Old North!"
  ktv_events.0014.desc: "The Cumbrians in the north of England have declared themselves a kingdom."
  ktv_events.0014.a: "Perhaps the Old North will see glory again."
  custom_mercia: "Mercia"
  restore_mercia_decision: "Restore Mercian Supremacy"
  restore_mercia_decision_confirm: "A new era for Mercia!"
  restore_mercia_decision_desc: "In the time of Offa, Mercia was the predominant Anglo-Saxon kingdom among the entire island. We shall claim his legacy and eclipse our foes once again."
  restore_mercia_decision_tooltip: "Make Mercia a [de_jure|E] [kingdom|E]"
  ktv_events.0015.t: "Second Mercian Supremacy"
  ktv_events.0015.desc: "Once upon a time, King Offa established a Mercian hegemony over all under the Humber river. Now, we have recovered from our decline, and this new Mercian Supremacy shall be for good."
  ktv_events.0015.a: "I am as Offa reborn!"
  ktv_events.0016.desc: "[founder.GetName] of [founder.GetPrimaryTitle.GetNameNoTier] has proclaimed a new era of Mercian supremacy on the island, seeking to imitate their great king Offa."
  ktv_events.0016.a: "Hah, foolish!"

  restore_east_anglia_decision: "Elevate the East Angles"
  restore_east_anglia_decision_confirm: "East Anglia is strong!"
  restore_east_anglia_decision_desc: "As a weaker petty kingdom among Anglo-Saxon Britain, we have been dominated by the other kingdoms seeking dominion over all England. It is time to stand up on our own two feet and prove our mettle."
  restore_east_anglia_decision_tooltip: "Make East Anglia a [de_jure|E] [kingdom|E]"
  ktv_events.0017.t: "East Anglia Ascendant"
  ktv_events.0017.desc: "Often under the boot of other Anglo-Saxon kingdoms, I have thrown off the yoke of conquerors and elevated East Anglia to new heights."
  ktv_events.0017.a: "Small, but strong."
  ktv_events.0018.desc: "The ruler of East Anglia has proclaimed itself a grand kingdom, having beaten off repeated incursions by the other kingdoms in Britain."
  ktv_events.0018.a: "Let's see how long they can withstand their enemies."

  restore_ogledd_decision: "Restore the Old North"
  restore_ogledd_decision_tooltip: "Restore the Old North"
  restore_ogledd_decision_confirm: "Out with the Saxons!"
  restore_ogledd_decision_desc: "We now have driven the Saxons out of much of the ancient Yr Hen Ogledd, The Old North. Under Briton control, we can take back our ancient birthright."
  restore_ogledd_decision_effects_de_jure_tt: "Ancient petty Briton kingdoms are restored into a united De Jure Kingdom. Strathclyde, Lothian, Northumberland, Lancaster, and York will become part of the new kingdom if held."
  nick_northdragon: "The Dragon of the North"
  ktv_events.0021.t: "Restoration of the Old North"
  ktv_events.0021.desc: "The Britons do not take kindly to invaders of any kind. For centuries, we have struggled against them, fighting to reclaim our home; and with cunning and skill, I have come to reunite the Old North. Come what may, [founder.GetPrimaryTitle.GetNameNoTierNoTooltip] shall endure."
  ktv_events.0021.a: "I am Arthur reborn!"
  ktv_events.0021.b: "My kingdom is the only title that matters."
  ktv_events.0022.desc: "After centuries of struggle, [founder.GetFullName] has united the ancient briton kingdoms of northern England, called [founder.GetPrimaryTitle.GetNameNoTier] by its inhabitants, and thrown back their island's foreign invaders. Already many in the new kingdom have begun talk of expelling the Anglo-Saxons from Britain altogether, undoing their invasion hundreds of years ago.\n\nThough the other lords of the British Isles are unlikely to brook this upstart power infringing on what they view as their ancestral lands, the [founder.GetPrimaryTitle.GetAdjective] people have weathered worse invasions than anything this modern age can muster. Already, they prepare to resist the inevitable grim-retaliation..."
  ktv_events.0022.a: "First the North, then the rest of Prydain!"
  ktv_events.0022.b: "We will push them back to Hadrian's wall."
  ktv_events.0022.c: "Minor kingdoms come and go."
  custom_hen_ogledd: "Yr Hen Ogledd"
  form_hen_ogledd_kingdom_decision.completely_control_X_percents_from_hen_ogledd: "At least #V 70%#! of all [counties|E] from [GetGeographicalRegion('custom_hen_ogledd').GetName] is controlled either by you, your [tributaries|E], or your [confederation|E] members."
  restore_ogledd_stretch_goals_lothian: "If [completely_controlled|E] or title is held, [lothian.GetName] will become [de_jure|E] part of [ogledd.GetName]"
  restore_ogledd_stretch_goals_york: "If [completely_controlled|E] or title is held, [york.GetName] will become [de_jure|E] part of [ogledd.GetName]"
  restore_ogledd_stretch_goals_northumberland: "If [completely_controlled|E] or title is held, [northumberland.GetName] will become [de_jure|E] part of [ogledd.GetName]"
  restore_ogledd_stretch_goals_lancaster: "If [completely_controlled|E] or title is held, [lancaster.GetName] will become [de_jure|E] part of [ogledd.GetName]"

