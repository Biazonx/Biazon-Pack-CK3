l_english:
 
 bzn_decisions.6767.t:0 "Claim Kut"
 bzn_decisions.6767.desc:0 "My might is growing by the day, and my people see that I am destined to do great things. It cannot be a coincidence that I am so successfull. It is widely known that tengri grants great Kut to those we deems worthy, marking the ruler's mandate of the eternal blue sky. Thus, a ruler's success as a leader is a sign of being blessed by Tengri. I should make it widely known that I am Tengri's chosen, and that the world shall bow before me."
 bzn_decisions.6767.claim:0 "I am chosen by the Eternal Blue Sky!"
 bzn_decisions.6767.claim.tt:0 "You claim to have the mandate of the sky, enabling you to trade Piety for Legitimacy"
 bzn_decisions.6767.optout:0 "I should wait with making such claims."
 bzn_decisions.6767.optout.tt:0 "You wait with claiming Kut."
 trait_kut: "Kut"
 trait_kut_desc: "A bearer of Kut, the sacred fortune and divine favor believed to grant legitimacy, prosperity, and the right to rule."
 trait_kut_character_desc: "A bearer of Kut, the sacred fortune and divine favor believed to grant legitimacy, prosperity, and the right to rule."
 trait_track_kut: "Kut"
 trait_track_kut_desc: "Kut"
 
 claim_kut_decision:0 "Claim Kut"
 claim_kut_decision_tooltip:0 "Announce to the world that you have the mandate of Tengri"
 claim_kut_decision_desc:1 "#F Kut is a vital force sent by Tengri himself. Those with great kut are given mandate of the eternal blue sky which legitimates their rule. Their efficacy as rulers are evidence of being blessed by Tengri. If a ruler would begin to make poor decisions and become a bad ruler, it's a sign that the ruler has lost his kut and must therefor be disposed. \nI have proven myself to be an effective leader, and my power is increasing. Surely, I have been blessed with great kut. The world shall know that I have been chosen by Tengri himself.#!"
 claim_kut_decision_effect_tooltip:1 "You will announce to the world that you have the mandate of the eternal blue sky."
 claim_kut_decision_confirm:0 "The world shall know!"
 reinforce_kut_decision:0 "Reinforce Kut"
 reinforce_kut_decision_tooltip:0 "Strengthen your mandate of Tengri"
 reinforce_kut_decision_desc:1 "#F Kut is a vital force sent by Tengri himself. Those with great kut are given mandate of the eternal blue sky which legitimates their rule. Their efficacy as rulers are evidence of being blessed by Tengri. If a ruler would begin to make poor decisions and become a bad ruler, it's a sign that the ruler has lost his kut and must therefor be disposed. \nI have announced my mandate of Tengri, but to keep it I have to continously prove my worth, or else I might be disposed of...#!"
 reinforce_kut_decision_effect_tooltip:1 "You will strengthen your claim of mandate of the eternal blue sky."
 reinforce_kut_decision_confirm:0 "I am still worthy!"